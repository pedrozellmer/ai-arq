name: Bancada (pytest)

# 🚨 23/08/2026 (auditoria): a bancada existia e estava APAGADA.
# `pytest backend/tests/` colhia 6 testes de UM arquivo e abortava com
# "I/O operation on closed file" — os outros 17 arquivos (consolidação de
# bitola, cotas do DXF, engine_rules, estrutural, trava de jobs concorrentes,
# revision_feedback) nunca rodavam juntos, e nada no CI os chamava.
# Agora roda a cada push, ANTES do smoke: erro de lógica morre aqui, sem
# esperar o deploy chegar na produção.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  bancada:
    runs-on: ubuntu-latest
    # 07/09/2026: 15 -> 30. A conversão dos guardas cegos trocou leitura de
    # fonte por EXECUÇÃO — vários agora sobem o motor de verdade (process_job,
    # Duktape rodando o JS do admin), e a bancada local foi de ~9 pra 15min54s.
    # Com o teto em 15 o job morreria por tempo, e a falha por timeout não diz
    # QUAL teste — é a mais cara de diagnosticar depois da falha de coleta.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          # 🪤 07/09/2026 — dukpy entrou aqui depois de o CI quebrar em 12s no
          # a1cd349: guardas novos rodam JavaScript de verdade (Duktape) e o
          # `import dukpy` é DURO de propósito — `importorskip` viraria skip
          # silencioso, e guarda que pula não guarda. Eu tinha dukpy na minha
          # máquina e o CI não: medi com ferramenta que o outro lado não tem.
          # O guarda `test_dependencia_de_teste_declarada` impede a próxima.
          pip install pytest pyflakes esprima dukpy

      # A regra que nasceu do deploy 8d597a6 (NameError no boot, 21/08):
      # nome indefinido não aparece no py_compile, só no pyflakes.
      - name: pyflakes (nome indefinido derruba o boot)
        run: |
          python -m pyflakes backend/*.py | grep "undefined name" && exit 1 || true

      - name: pytest
        working-directory: backend
        run: |
          set -o pipefail
          python -m pytest tests/ -q 2>&1 | tee "$RUNNER_TEMP/pytest.txt"

      # 🩸 09/09/2026 — EU NAO CONSEGUIA LER A PROPRIA FALHA.
      # O CI ficou vermelho num commit meu e o log da Action exige LOGIN: a API
      # publica devolve 403 em /jobs/{id}/logs, a pagina web pede "Sign in to
      # view logs", e artefato tambem e autenticado. A bancada passava verde na
      # minha maquina (Windows) e caia so no Linux — 13 testes sao Unix-only e
      # eu nao tenho sinal nenhum deles aqui.
      # 🔑 A memoria diz "CI vermelho e MEU de achar". Sem isto, nao era: eu
      # dependia do Pedro copiar o log pra mim.
      # As ANOTACOES de check run SAO publicas — e sao o unico canal que sai
      # sem autenticacao. Entao a falha vira anotacao.
      - name: a falha tem que ser legivel SEM login
        if: failure()
        run: |
          F="$RUNNER_TEMP/pytest.txt"
          [ -f "$F" ] || { echo "::error::pytest nao deixou saida em $F"; exit 0; }
          grep -E "^(FAILED|ERROR)" "$F" | head -40 | while IFS= read -r l; do
            echo "::error::$l"
          done
          # o resumo e as ultimas linhas dizem QUANTOS e POR QUE
          tail -25 "$F" | while IFS= read -r l; do
            echo "::error::| $l"
          done

      # 🚨 25/08/2026 (auditoria do dia): o passo acima conferia o VERDE e nao o
      # NUMERO. Foi exatamente assim que a bancada ficou apagada em 23/08 —
      # `pytest tests/` colhia 6 de 70 testes e abortava, e o job passava verde
      # porque os 6 passaram. 17 arquivos nunca rodavam.
      #
      # O lado dos scripts legados ja tinha essa checagem; o lado do pytest, nao.
      # Piso, nao alvo: so acusa QUEDA. Teste novo sobe o numero e nao quebra
      # nada; teste que some, ou arquivo que para de ser colhido, derruba o CI.
      - name: a bancada nao pode ENCOLHER
        working-directory: backend
        env:
          # 🪤 27/08/2026 — O PISO ENVELHECEU ENQUANTO A BANCADA CRESCIA.
          # Ele nasceu em 23/08 pra pegar "pytest colheu 6 de 70 e passou
          # verde". Mas a bancada foi de 620 pra 837 em dois dias, e o piso
          # ficou em 700: perder DOIS arquivos inteiros ainda passaria.
          # Guarda com folga de 137 protege cada vez menos.
          # 📌 Ao acrescentar teste, subir isto junto — a margem é de ~30, o
          # bastante pra não quebrar num commit que remove um caso obsoleto.
          # 02/09/2026: 1044 -> 1367. A bancada foi a 1397 num dia (motor,
          # painel admin e smoke), e o piso velho já deixava passar a perda de
          # 25% dela. O guarda `test_o_piso_do_CI_faz_sentido_contra_a_realidade`
          # foi quem cobrou — piso que envelhece é piso que não guarda nada.
          # 04/09/2026: 1367 -> 1550. A bancada foi a 1824 em dois dias (varredura
          # adversarial + os achados que saíram da planilha da cliente-22). Mesmo
          # guarda cobrando de novo, pelo mesmo motivo.
          # 05/09/2026: 1550 -> 1800. A bancada colhe 2099 (e-mails, anexo,
          # financeiro). O guarda test_o_piso_do_CI_faz_sentido_contra_a_realidade
          # exige piso >= 75% do colhido — 1550 já deixava passar a perda de
          # 500 testes calada.
          # 07/09/2026: 1800 -> 1900. A bancada colhe 2428 — a conversão dos
          # guardas cegos para testes que EXECUTAM traz mais casos por arquivo
          # (cada mutação vira um teste). Mesmo guarda, terceira vez: piso que
          # envelhece é piso que não guarda nada.
          # 07/09, 2a subida do dia: 1900 -> 2000. A bancada colhe 2565 depois
          # de trazer as lacunas fechadas. O guarda exige piso >= 75% do colhido.
          # 07/09, 3a subida: 2000 -> 2200. Fechar lacuna quase sempre e VARIAR
          # uma dimensao que o fixture nao variava (um item vira dois, um ramo
          # vira dois), entao cada lacuna fechada traz casos novos: a bancada
          # foi de 2482 pra 2728 nos quatro lotes.
          # 08/09/2026: 2200 -> 2300. A bancada colhe 2938 depois da varredura
          # dos 90 logs que nunca dispararam (6 instrumentos mortos, cada um com
          # guarda próprio). O piso ficou em 74,9% e a regra exige 75% — o
          # guarda `test_o_piso_do_CI_faz_sentido_contra_a_realidade` cobrou por
          # UMA casa decimal, que é o tipo de precisão que faz o instrumento
          # valer. Quinta subida; piso que envelhece é piso que não guarda nada.
          # 08/09/2026, 2a subida do dia: 2300 -> 2400. A bancada colhe 3081
          # depois da auditoria de segurança (IDOR do item_id, SSRF do PDF,
          # piso de dependência, paginação acima de mil itens) e dos consertos
          # de área e de LGPD. O guarda exige piso >= 75% do colhido, e 2300
          # tinha caído pra 74,6% — sexta vez que ele cobra, sempre pelo mesmo
          # motivo: piso que envelhece é piso que não guarda nada.
          #
          # 08/09/2026, 3a subida do dia: 2400 -> 2800. A bancada colhe 3201
          # (guardas novos do requirements e dos pares acoplados) e o 2400
          # tinha caído pra 74,98% — errou por UM teste.
          #
          # 🪤 E AQUI O PADRÃO IMPORTA MAIS QUE O NÚMERO: esta é a SÉTIMA vez
          # que este guarda cobra, e todas as seis anteriores eu subi o piso pro
          # MÍNIMO QUE PASSAVA. Piso no mínimo volta a quebrar assim que a
          # bancada cresce ~8% — ou seja, na sessão seguinte. O trabalho de
          # subir vira ritual, e ritual repetido é o que ensina a ignorar
          # alarme (ver [[feedback_alarme_sem_controle_20260826]]).
          #
          # 🔑 2800 é 87,5% dos 3201 de hoje, e só volta a cobrar quando a
          # bancada passar de 3733. Continua pegando qualquer queda maior que
          # 12,5% — que é o que o piso existe pra pegar (colheita quebrada,
          # arquivo que parou de ser coletado), não flutuação de rotina.
          PISO: 2800
        run: |
          N=$(python -m pytest tests/ -q --collect-only 2>/dev/null | tail -1 | grep -oE '^[0-9]+' || echo 0)
          echo "testes colhidos: $N (piso: $PISO)"
          if [ "$N" -lt "$PISO" ]; then
            echo "::error::A bancada colheu $N testes, abaixo do piso de $PISO."
            echo "Nao e o verde que importa: em 23/08 o pytest colhia 6 de 70 e"
            echo "passava. Se um arquivo parou de ser colhido, o conftest ou um"
            echo "erro de import estao engolindo ele."
            exit 1
          fi

  # ══════════════════════════════════════════════════════════════════════════
  # 🩸 14/09/2026 — O CI APROVAVA NUMA VERSÃO DE PYTHON QUE A PRODUÇÃO NÃO TEM.
  # A bancada acima roda em 3.13. O Render roda a imagem do
  # `backend/Dockerfile`, que é `python:3.11-slim`. Sintaxe de 3.12+ (f-string
  # da PEP 701, `type X = int` da PEP 695) passa verde aqui e derruba o BOOT
  # lá — a mesma família do NameError de 21/08, que o pyflakes passou a pegar,
  # e do pin de 08/09, que quebrou no INSTALAR com a bancada verde.
  # 🪤 A versão NÃO é decorada aqui: sai do Dockerfile. Se a produção subir de
  # versão, este job sobe junto. Se a leitura falhar, o job PARA — versão vazia
  # viraria setup-python no default e o guarda ficaria cego.
  compila-no-python-da-producao:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Qual Python a producao roda (lido do Dockerfile)
        id: prod
        run: |
          set -eu
          linha=$(grep -F -m1 'FROM python:' backend/Dockerfile)
          versao=$(printf '%s' "$linha" | cut -d: -f2 | cut -d- -f1)
          case "$versao" in
            3.*) ;;
            *) echo "::error::nao consegui ler a versao do Python em backend/Dockerfile (li '"'"'$versao'"'"')"; exit 1 ;;
          esac
          echo "versao=$versao" >> "$GITHUB_OUTPUT"
          echo "a producao roda Python $versao"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.prod.outputs.versao }}

      # 🧪 CONTROLE NEGATIVO, no molde da bancada: o passo tem que provar que
      # sabe REPROVAR. Este arquivo só compila em 3.12+; se ele passar, o job
      # não está na versão da producao e o passo de baixo nao prova nada.
      - name: o passo sabe reprovar? (controle negativo)
        run: |
          set -u
          arq="$RUNNER_TEMP/so_compila_no_3_12.py"
          {
            echo 'print(f"{"aspas iguais aninhadas: PEP 701, so 3.12+"}")'
            echo 'type Apelido = int  # PEP 695, so 3.12+'
          } > "$arq"
          if python -m py_compile "$arq"; then
            echo "::error::o controle negativo COMPILOU. Ou este job nao esta na versao da producao, ou a producao subiu pra 3.12+ e o controle precisa de sintaxe mais nova."
            exit 1
          fi
          echo "ok: sintaxe de 3.12+ e recusada aqui, como seria no Render"

      - name: Compilar o backend inteiro
        run: |
          python -VV
          python -m compileall -q backend
