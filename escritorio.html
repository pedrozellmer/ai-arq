<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<title>Escritório — AI.arq</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js" integrity="sha384-qafw21c/iciq0VXsi9FzkfoQv5I/V0iqE4lSNcKXPnW9/UTJLnv5CcN4FHxVLnKg" crossorigin="anonymous"></script>
<script src="aiarq-utils.js"></script>
<!--
  ESCRITÓRIO (piloto DTZ, 23/09/2026) — a tela.
  Lê e grava DIRETO no banco com o login da pessoa (supabase-js). Quem decide
  quem pode o quê é o banco: RLS + gatilhos das tabelas escritorio_* (34
  situações provadas). A tela só esconde o que a pessoa não pode fazer — se
  esconder errado, o banco recusa e a mensagem dele aparece aqui.
  Servidor só no convite (/api/escritorio/...). Drive e IA das atas: próximas etapas.
  🪤 O Tailwind do site é um build ESTÁTICO: componente desta tela mora no <style>
  abaixo (classes próprias), não em utilitário que pode não existir no build.
-->
<style>
  html { color-scheme: light; }
  body { font-family: 'Inter', -apple-system, sans-serif; background:#F9FAFB; color:#111827; min-height:100vh; margin:0; }
  .gradient-main { background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%); }
  [hidden] { display:none !important; }
  .tab { font-variant-numeric: tabular-nums; }
  /* menu lateral: o CSS do menu-lateral.js */
  #side{position:fixed;top:0;left:0;height:100%;width:248px;background:#fff;border-right:1px solid #E2E8F0;display:flex;flex-direction:column;padding:14px 12px;overflow-y:auto;transform:translateX(-100%);transition:transform .28s ease;z-index:10000;box-sizing:border-box}
  #side.aberto{transform:translateX(0)}
  #scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:9999;opacity:0;pointer-events:none;transition:opacity .28s ease}
  #scrim.aberto{opacity:1;pointer-events:auto}
  .s-topo{display:flex;align-items:center;justify-content:space-between;padding:2px 8px 14px;border-bottom:1px solid #E2E8F0;margin-bottom:14px}
  .s-marca{display:flex;align-items:center;gap:9px;text-decoration:none}
  .s-logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#4F46E5,#22D3EE);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
  .s-nome{font-weight:700;font-size:16px;color:#0F172A}
  .s-grp{margin-bottom:14px}
  .s-grp-t{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:#94A3B8;font-weight:700;padding:0 10px;margin-bottom:5px}
  .s-it{display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border-radius:9px;font-size:14px;color:#334155;text-align:left;cursor:pointer;text-decoration:none;border:0;background:transparent;font-family:inherit;box-sizing:border-box}
  .s-it:hover{background:#F1F5F9}
  .s-it.on{background:#EEF2FF;color:#4F46E5;font-weight:600}
  .s-it svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;color:#94A3B8}
  .s-it.on svg{color:#4F46E5}
  .s-est{margin-left:auto;font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;white-space:nowrap;background:#F1F5F9;color:#475569}
  .s-est.pend{background:#FEF3C7;color:#92400E}
  .s-fix{background:#F8FAFC;border:1px solid #E2E8F0;border-left:3px solid #4F46E5;border-radius:8px;padding:9px 11px;margin:0 2px 14px}
  .s-fix .tag{font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#94A3B8}
  .s-fix b{display:block;font-size:13.5px;font-weight:600;margin-top:3px;line-height:1.35;color:#0F172A}
  .s-fix span{font-size:11.5px;color:#64748B}
  .s-rod{margin-top:auto;border-top:1px solid #E2E8F0;padding-top:12px;font-size:13px;color:#334155;display:flex;align-items:center;gap:9px;padding-left:6px}
  #burger,#fechar{display:inline-flex;align-items:center;justify-content:center;background:transparent;border:0;cursor:pointer;padding:6px;border-radius:8px;min-width:44px;min-height:44px}
  @media (min-width:1024px){ #side{transform:translateX(0);z-index:40} #scrim{display:none} #burger,#fechar{display:none} body{padding-left:248px} }
  /* cabeçalho */
  .cab{background:#fff;border-bottom:1px solid #E5E7EB;position:sticky;top:0;z-index:30}
  .cab-in{max-width:72rem;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px}
  .trilha{font-size:11px;color:#6B7280;display:flex;gap:4px;flex-wrap:wrap}
  .trilha a{color:inherit;text-decoration:none} .trilha a:hover{color:#4F46E5}
  .titulo{font-weight:600;color:#1F2937;margin:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .beta{font-size:12px;background:#EEF2FF;color:#4338CA;padding:4px 10px;border-radius:99px;font-weight:500;white-space:nowrap}
  main{max-width:72rem;margin:0 auto;padding:24px 16px 48px;display:flex;flex-direction:column;gap:20px;box-sizing:border-box}
  /* peças */
  .card{background:#fff;border:1px solid #E2E8F0;border-radius:16px;box-shadow:0 1px 2px rgba(15,23,42,.04);padding:22px}
  .h2{font-size:18px;font-weight:700;color:#111827;margin:0}
  .sub{font-size:12px;color:#6B7280;margin:4px 0 0}
  .lbl{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#64748B;margin:0 0 6px}
  .in{border:1px solid #CBD5E1;border-radius:8px;padding:8px 10px;font-size:13px;color:#1E293B;background:#fff;width:100%;min-width:0;font-family:inherit;box-sizing:border-box}
  .in:focus-visible,button:focus-visible,a:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #4F46E5;outline-offset:2px}
  .btn{padding:8px 14px;border-radius:8px;border:1px solid #CBD5E1;background:#fff;color:#334155;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none}
  .btn:hover{background:#F8FAFC}
  .btn:disabled{opacity:.55;cursor:wait}
  .btn-p{background:#4F46E5;border-color:#4F46E5;color:#fff;font-weight:600} .btn-p:hover{background:#4338CA}
  .btn-d{background:#1E293B;border-color:#1E293B;color:#fff;font-weight:600} .btn-d:hover{background:#0F172A}
  .btn-g{background:linear-gradient(135deg,#4f46e5,#06b6d4);border:0;color:#fff;font-weight:600;padding:9px 16px}
  .btn-r{border-color:#FECACA;background:#FEF2F2;color:#B91C1C;font-weight:600}
  .btn-s{padding:5px 10px;font-size:12px}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid;white-space:nowrap}
  .pill i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
  .p-ok{background:#ECFDF5;color:#065F46;border-color:#A7F3D0} .p-warn{background:#FFFBEB;color:#92400E;border-color:#FDE68A}
  .p-late{background:#FEF2F2;color:#991B1B;border-color:#FECACA} .p-ind{background:#EEF2FF;color:#4338CA;border-color:#C7D2FE}
  .p-mut{background:#F8FAFC;color:#475569;border-color:#E2E8F0}
  .chip{font-size:12px;padding:5px 11px;border-radius:99px;border:1px solid #E2E8F0;color:#475569;background:#fff;cursor:pointer;font-family:inherit;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
  .chip[aria-pressed="true"]{border-color:#C7D2FE;color:#4338CA;background:#EEF2FF;font-weight:600}
  .chip .n{font-size:10.5px;opacity:.7}
  .av{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex:none;background:#EEF2FF;color:#4338CA}
  .avs{display:flex;margin-left:auto} .avs .av{margin-left:-6px;box-shadow:0 0 0 2px #fff} .avs .av:first-child{margin-left:0}
  .linha{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .grade{display:grid;gap:14px}
  @media (min-width:640px){ .g2{grid-template-columns:repeat(2,minmax(0,1fr))} }
  @media (min-width:900px){ .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))} }
  .kpi{position:relative;overflow:hidden;background:#fff;border:1px solid #E2E8F0;border-radius:16px;padding:16px}
  .kpi::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(135deg,#4f46e5,#22d3ee)}
  .kpi.alerta::before{background:linear-gradient(135deg,#f59e0b,#fbbf24)}
  .kpi .rot{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#64748B;margin:0 0 6px}
  .kpi .val{font-size:18px;font-weight:700;margin:0} .kpi .det{font-size:12px;color:#64748B;margin:4px 0 0}
  .voltar{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:#4338CA;background:#fff;border:1px solid #C7D2FE;border-radius:8px;padding:6px 12px;cursor:pointer;font-family:inherit}
  .etapas{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px}
  .etp{flex:1 0 auto;min-width:96px;text-align:center;font-size:11px;font-weight:600;padding:7px 8px 6px;border-radius:8px;background:#F1F5F9;color:#64748B;border:0;border-bottom:3px solid #E2E8F0;cursor:pointer;font-family:inherit}
  .etp.feita{background:#ECFDF5;color:#065F46;border-bottom-color:#10B981}
  .etp.atual{background:#EEF2FF;color:#3730A3;border-bottom-color:#4F46E5}
  .etp[aria-pressed="true"]{box-shadow:inset 0 0 0 2px #4F46E5}
  .etp small{display:block;font-size:10px;font-weight:500;opacity:.7}
  .tool{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;border:1px solid #E2E8F0;border-radius:14px;background:#fff;cursor:pointer;font-family:inherit;text-decoration:none;color:inherit}
  .tool:hover{border-color:#A5B4FC}
  .tool .ti{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;background:#EEF2FF;color:#4F46E5}
  .tool b{display:block;font-size:14px;color:#0F172A} .tool span{display:block;font-size:12px;color:#64748B;margin-top:2px}
  /* quadro */
  .board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(236px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
  .col{background:#F1F5F9;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
  .col.alvo{background:#E0E7FF}
  .col-h{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:#334155;padding:2px 4px 4px}
  .col-h i{width:8px;height:8px;border-radius:50%;flex:none} .col-h .n{margin-left:auto;font-weight:600;color:#64748B;font-size:11px}
  .cards{display:flex;flex-direction:column;gap:8px;min-height:12px}
  .tc{background:#fff;border:1px solid #E2E8F0;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;cursor:grab;box-shadow:0 1px 2px rgba(15,23,42,.05)}
  .tc:hover{box-shadow:0 4px 12px -4px rgba(15,23,42,.18)}
  .tc.late{border-left:3px solid #EF4444} .tc.arr{opacity:.35}
  .tc p{margin:0;font-size:13px;font-weight:500;color:#1E293B;line-height:1.35}
  .drop{height:3px;border-radius:3px;background:#4F46E5}
  .add{text-align:left;font-size:12.5px;color:#475569;background:transparent;border:0;padding:6px;border-radius:8px;cursor:pointer;font-family:inherit}
  .add:hover{background:#E2E8F0}
  .lista{list-style:none;margin:0;padding:0} .lista li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #F1F5F9} .lista li:first-child{border-top:0}
  .men{color:#4338CA;font-weight:600;background:#EEF2FF;border-radius:4px;padding:0 3px}
  .vazio{font-size:13px;color:#64748B;margin:0}
  .aviso{border-radius:12px;border:2px solid #C7D2FE;background:linear-gradient(90deg,#EEF2FF,#ECFEFF);padding:14px 16px;font-size:13px;color:#1F2937}
  .modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(15,23,42,.45)}
  .modal-c{background:#fff;border-radius:16px;box-shadow:0 20px 50px -12px rgba(15,23,42,.4);width:100%;max-width:36rem;max-height:92vh;overflow-y:auto}
  .modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 12px;border-bottom:1px solid #F1F5F9}
  .modal-b{padding:18px 22px;display:flex;flex-direction:column;gap:14px}
  .rodape{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;padding-top:12px;border-top:1px solid #F1F5F9}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(10px);background:#1E293B;color:#fff;font-size:13px;font-weight:500;padding:10px 16px;border-radius:10px;opacity:0;transition:all .25s;z-index:80;pointer-events:none;max-width:calc(100% - 32px)}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.erro{background:#991B1B}
  .gira{border:2px solid #c7d2fe;border-top-color:#4f46e5;border-radius:9999px;width:2rem;height:2rem;animation:spin 1s linear infinite;margin:40px auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms!important;transition-duration:.01ms!important} }
</style>
</head>
<body>
<div id="scrim" onclick="menu(false)"></div>
<aside id="side" aria-label="Menu do escritório">
  <div class="s-topo">
    <a class="s-marca" href="dashboard.html"><span class="s-logo">AI</span><span class="s-nome">AI.arq</span></a>
    <button id="fechar" aria-label="Fechar menu" onclick="menu(false)">✕</button>
  </div>
  <div id="side-c"></div>
  <div class="s-rod"><span class="av" id="eu-ini">·</span><span id="eu-nome" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">…</span></div>
</aside>

<header class="cab">
  <div class="cab-in">
    <button id="burger" aria-label="Abrir menu" onclick="menu(true)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div style="flex:1;min-width:0;padding:4px 0"><nav class="trilha" id="trilha"></nav><h1 class="titulo" id="titulo">Escritório</h1></div>
    <span class="beta">Piloto</span>
  </div>
</header>

<main id="main"><div class="gira" role="status" aria-label="Carregando"></div></main>
<div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-t" onclick="if(event.target===this)fecharModal()">
  <div class="modal-c"><div class="modal-h"><h2 id="modal-t" class="h2" style="font-size:17px"></h2><button class="btn btn-s" onclick="fecharModal()" aria-label="Fechar">✕</button></div><div class="modal-b" id="modal-b"></div></div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
const sb = window.sbClient;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const MODELO_DTZ = ['Briefing', 'Levantamento', 'Estudo preliminar', 'Anteprojeto', 'Executivo', 'Compatibilização', 'Orçamentos e compras', 'Obra', 'Entrega'];
const ST = [
  { k: 'afazer', t: 'A fazer', cor: '#94A3B8' },
  { k: 'dev', t: 'Em desenvolvimento', cor: '#4F46E5' },
  { k: 'revdtz', t: 'Aguardando revisão', cor: '#8B5CF6' },
  { k: 'revsol', t: 'Revisão solicitada', cor: '#EF4444' },
  { k: 'cliente', t: 'Aguardando cliente', cor: '#F59E0B' },
  { k: 'aprov', t: 'Aprovado', cor: '#10B981' },
  { k: 'ok', t: 'Concluído', cor: '#475569' },
];
const ST_EQUIPE = ['afazer', 'dev', 'revdtz'];   // o mesmo que o gatilho escritorio_tarefa_guarda
const stT = (k) => (ST.find((s) => s.k === k) || {}).t || k;

const COLS_MEMBRO = 'id,projeto_id,user_id,nome,papel,funcao,status,convidado_em,aceito_em,removido_em';
// ── estado ──
let NO_PILOTO = false;
let EU = null, PROJETOS = [], PROJ = null, MEMBROS = [], PAPEL = null, TAR = [], PESSOAS_T = [], ATAS = [], NOTAS = {};
let VIEW = 'lista', FILTRO = 'todas', FILTRO_E = '', ETAPA_SEL = null;

// ── utilidades ──
function toast(t, erro) { const el = $('toast'); el.textContent = t; el.className = 'toast on' + (erro ? ' erro' : ''); clearTimeout(toast._t); toast._t = setTimeout(() => (el.className = 'toast'), erro ? 6000 : 3800); }
function falhou(e, oque) {
  // a mensagem do banco (gatilho/RLS) já vem em português quando é regra nossa
  const m = String((e && (e.message || e.details)) || '');
  const nossa = /(dono|admin|freela|convite|quem move|não muda|não sai|não se edita|A fazer)/i.test(m);
  toast((oque ? oque + ': ' : '') + (nossa ? m : /row-level security|permission/i.test(m) ? 'você não tem permissão pra isso neste projeto.' : 'não deu certo agora. Tente de novo.'), true);
  console.error(oque, e);
}
function menu(abre) { $('side').classList.toggle('aberto', abre); $('scrim').classList.toggle('aberto', abre); }
function abrirModal(t, html) { $('modal-t').textContent = t; $('modal-b').innerHTML = html; $('modal').hidden = false; const f = $('modal-b').querySelector('input,textarea,select'); if (f) f.focus(); }
function fecharModal() { $('modal').hidden = true; }
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('modal').hidden) fecharModal(); });
const hoje = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const dISO = (s) => { const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); };
// data pura (2026-09-23) é o dia; com horário (timestamptz do banco, em UTC) vira a hora LOCAL antes de virar dia
const FUSO = 'America/Sao_Paulo';
const dBR = (s) => (!s ? '' : String(s).length > 10
  ? new Date(s).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', timeZone: FUSO })
  : dISO(s).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }));
// 🪤 FUSO: toISOString() é UTC — depois das 21h em Brasília já é amanhã. A data do dia é a LOCAL.
const hojeISO = () => new Intl.DateTimeFormat('en-CA', { timeZone: FUSO, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
const dias = (s) => Math.round((dISO(s) - hoje()) / 864e5);
const souAdmin = () => PAPEL === 'dono';
const meuMembro = () => MEMBROS.find((m) => m.user_id === EU.id);
const nomeDe = (m) => (m && (m.nome || (m.email || '').split('@')[0])) || '—';
const curto = (m) => nomeDe(m).split(' ')[0];
const iniciais = (m) => nomeDe(m).split(/\s+/).filter(Boolean).slice(0, 2).map((p) => p[0].toUpperCase()).join('') || '·';
const av = (m) => `<span class="av" title="${esc(nomeDe(m))}">${esc(iniciais(m))}</span>`;
const pessoasDa = (t) => PESSOAS_T.filter((p) => p.tarefa_id === t.id).map((p) => MEMBROS.find((m) => m.id === p.membro_id)).filter(Boolean);
const avs = (t) => `<span class="avs">${pessoasDa(t).map(av).join('')}</span>`;
const aberta = (t) => !['aprov', 'ok'].includes(t.status);
const atrasada = (t) => aberta(t) && t.prazo && dias(t.prazo) < 0;
const eMinha = (t) => { const eu = meuMembro(); return !!eu && pessoasDa(t).some((m) => m.id === eu.id); };
function pillPrazo(t) {
  if (!t.prazo) return '';
  const d = dias(t.prazo);
  if (!aberta(t)) return `<span style="font-size:11px;color:#64748B">${dBR(t.prazo)}</span>`;
  if (d < 0) return `<span class="pill p-late"><i></i>${-d} dia${d < -1 ? 's' : ''} atrasada</span>`;

  return `<span class="tab" style="font-size:11px;color:#475569">${dBR(t.prazo)}</span>`;
}

// ── rotas: #/ (lista) · #/p/<id>/<tela> · #/job/<job_id>/<tela> (vindo do menu de um projeto medido) ──
function lerRota() {
  const j = /^#\/job\/([A-Za-z0-9_-]{6,80})(?:\/(\w+))?/.exec(location.hash);
  if (j) return { job: j[1], id: null, view: j[2] || 'capa' };
  const m = /^#\/p\/([0-9a-f-]{36})(?:\/(\w+))?/.exec(location.hash);
  return m ? { id: m[1], view: m[2] || 'capa' } : { id: null, view: 'lista' };
}
function ir(view) { location.hash = view === 'lista' ? '#/' : `#/p/${PROJ.id}/${view}`; }

async function carregarProjetos() {
  const [r, pil] = await Promise.all([
    sb.from('escritorio_projetos').select('*').order('criado_em', { ascending: false }),
    // 🔒 A1: criar projeto é só pra quem está no piloto — o BANCO decide (tabela escritorio_piloto)
    sb.rpc('escritorio_no_piloto'),
  ]);
  if (r.error) throw r.error;
  PROJETOS = r.data || [];
  NO_PILOTO = !pil.error && pil.data === true;
}
async function carregarProjeto(id) {
  PROJ = PROJETOS.find((p) => p.id === id) || null;
  if (!PROJ) return false;
  const [m, t, tp, a, papel] = await Promise.all([
    // 🔒 colunas POR NOME: e-mail e telefone da equipe não vêm daqui (só o admin, pelo RPC abaixo)
    sb.from('escritorio_membros').select(COLS_MEMBRO).eq('projeto_id', id).order('convidado_em'),
    sb.from('escritorio_tarefas').select('*').eq('projeto_id', id).order('posicao'),
    sb.from('escritorio_tarefa_pessoas').select('*').eq('projeto_id', id),
    sb.from('escritorio_atas').select('*').eq('projeto_id', id).order('data', { ascending: false }),
    sb.rpc('escritorio_papel', { p_projeto: id }),
  ]);
  for (const r of [m, t, tp, a, papel]) if (r.error) throw r.error;
  MEMBROS = m.data; TAR = t.data; PESSOAS_T = tp.data; ATAS = a.data; PAPEL = papel.data;
  NOTAS = {};
  if (PAPEL === 'dono') {   // contatos da equipe: só o admin (LGPD — a equipe não precisa do telefone do colega)
    const c = await sb.rpc('escritorio_contatos', { p_projeto: id });
    if (!c.error) c.data.forEach((x) => { const m = MEMBROS.find((y) => y.id === x.membro_id); if (m) { m.email = x.email; m.telefone = x.telefone; } });
  }
  if (PAPEL === 'dono') {   // a anotação sobre cada pessoa: tabela própria, só o admin lê
    const n = await sb.from('escritorio_membro_notas').select('membro_id,observacao').eq('projeto_id', id);
    if (!n.error) n.data.forEach((x) => { NOTAS[x.membro_id] = x.observacao; });
  }
  return true;
}

async function navegar() {
  const r = lerRota();
  menu(false);
  try {
    if (r.job) { await abrirPeloJob(r.job, r.view); return; }
    if (!r.id) { VIEW = 'lista'; PROJ = null; await carregarProjetos(); }
    else {
      if (!PROJETOS.length || !PROJETOS.find((p) => p.id === r.id)) await carregarProjetos();
      if (!PROJ || PROJ.id !== r.id || !MEMBROS.length) { if (!(await carregarProjeto(r.id))) { location.hash = '#/'; return; } }
      VIEW = ['capa', 'tarefas', 'arquivos', 'atas', 'equipe'].includes(r.view) ? r.view : 'capa';
    }
  } catch (e) {
    $('main').innerHTML = `<div class="card"><p class="h2">Não consegui carregar agora</p><p class="sub">Foi um soluço de conexão com o banco. Recarregue a página em instantes.</p></div>`;
    console.error(e); return;
  }
  render();
}

// 🏢 Veio do menu de um projeto MEDIDO (24/09): abre o projeto do Escritório ligado a ele; no 1º clique, cria.
// Quem garante que o projeto medido é DESTA conta é o banco (gatilho escritorio_projeto_job_guarda), não
// esta tela: a conta de administração do site lê projetos de todos os clientes. Aqui é só a mensagem clara.
async function abrirPeloJob(job, view) {
  await carregarProjetos();
  const destino = (p) => location.replace(`#/p/${p.id}/${['tarefas', 'atas', 'equipe'].includes(view) ? view : 'capa'}`);
  const ja = PROJETOS.find((p) => p.job_id === job && p.dono === EU.id);
  if (ja) return destino(ja);
  if (!NO_PILOTO) return avisoJob('O Escritório está em piloto fechado', 'Por enquanto ele está ligado só pra algumas contas.');
  const { data: med, error: e1 } = await sb.from('projects').select('job_id,project_name,user_id').eq('job_id', job).maybeSingle();
  if (e1) throw e1;
  if (!med || med.user_id !== EU.id) return avisoJob('Esse projeto não é da sua conta', 'Só quem subiu o projeto medido pode levar ele pro Escritório.');
  const nome = String((window.tituloProjeto || String)(med.project_name || 'Projeto')).slice(0, 160);
  const { data, error } = await sb.from('escritorio_projetos')
    .insert({ dono: EU.id, nome, job_id: job, etapas: MODELO_DTZ, etapa_atual: MODELO_DTZ[0] }).select().single();
  if (error) {
    if (error.code === '23505') {            // duas abas / clique duplo: o outro já criou — abre o dele
      await carregarProjetos();
      const outro = PROJETOS.find((p) => p.job_id === job && p.dono === EU.id);
      if (outro) return destino(outro);
    }
    if (error.code === '42501') return avisoJob('Esse projeto não é da sua conta', 'Só quem subiu o projeto medido pode levar ele pro Escritório.');
    throw error;
  }
  PROJETOS.unshift(data); PROJ = null;
  toast('Projeto criado no Escritório, ligado ao projeto medido');
  destino(data);
}

let ARR = null;

async function mover(id, st, i) {

  const viz = TAR.filter((x) => x.status === st && x.id !== id && visivel(x)).sort((a, b) => a.posicao - b.posicao);

    const r = await sb.from('escritorio_tarefas').insert({ projeto_id: PROJ.id, titulo: l.t, status: cli ? 'cliente' : 'afazer', do_cliente: cli, prazo: l.p || null, etapa: PROJ.etapa_atual || null, ata_id: ata.id, posicao: ++pos, criado_por: EU.id }).select().single();
    if (r.error) { falhas++; continue; }
    if (l.q && !cli) { const p = await sb.from('escritorio_tarefa_pessoas').insert({ tarefa_id: r.data.id, membro_id: l.q, projeto_id: PROJ.id }); if (p.error) falhas++; }
  }
  fecharModal(); await recarregar();
  toast(falhas ? `Ata salva, mas ${falhas} tarefa(s) não entraram. Confira no quadro.` : `Ata salva${linhas.length ? ' · ' + linhas.length + ' tarefa(s) no quadro' : ''}`, !!falhas);
}

// ══════════════ EQUIPE ══════════════
function telaEquipe() {
  const vis = MEMBROS.filter((m) => m.status !== 'removido');
  return `<div class="aviso"><b>Quem você convida entra no projeto, não no escritório.</b><br>
      <span style="font-size:12.5px;color:#475569">Vê e edita: as tarefas e as atas deste projeto (e, na próxima etapa, a pasta do Drive). Vê o nome e a função dos colegas, mas não o e-mail nem o telefone. Não vê: os outros projetos, o financeiro e o resto do seu Drive.</span></div>
    <section class="card"><div class="linha" style="justify-content:space-between"><h2 class="h2">${vis.length} pessoa${vis.length > 1 ? 's' : ''}</h2>${souAdmin() ? '<button class="btn btn-p" onclick="convidar()">+ Convidar pessoa</button>' : ''}</div>
      <ul class="lista" style="margin-top:8px">${vis.map((m) => `<li style="flex-wrap:wrap">${av(m)}<div style="flex:1;min-width:180px"><b style="font-size:14px">${esc(nomeDe(m))}${m.user_id === EU.id ? ' <span style="font-weight:400;color:#64748B">(você)</span>' : ''}</b>
        <span class="sub" style="display:block;margin:0">${esc(m.funcao || (m.papel === 'dono' ? 'Admin do projeto' : ''))}${m.email ? ' · ' + esc(m.email) : ''}${m.telefone ? ' · ' + esc(m.telefone) : ''}</span>
        ${NOTAS[m.id] ? `<span class="sub" style="display:block;margin:0">${esc(NOTAS[m.id])}</span>` : ''}</div>
        ${m.papel === 'dono' ? '<span class="pill p-ind">admin · vê tudo</span>' : m.status === 'ativo' ? '<span class="pill p-ok"><i></i>no projeto</span>' : pillConvite(m)}
        ${souAdmin() && m.papel !== 'dono' ? `<button class="btn btn-s" onclick="editarPessoa('${m.id}')">Editar</button>${m.status === 'convidado' ? `<button class="btn btn-s" onclick="reenviar('${m.id}')">Reenviar convite</button>` : ''}<button class="btn btn-s" onclick="tirar('${m.id}')">${m.status === 'convidado' ? 'Cancelar convite' : 'Tirar do projeto'}</button>` : ''}
      </li>`).join('')}</ul></section>`;
}
// A14: 14 dias contados de convidado_em (a mesma validade do servidor)
function pillConvite(m) {
  const vence = new Date(new Date(m.convidado_em).getTime() + 14 * 864e5);
  if (vence < new Date()) return `<span class="pill p-late"><i></i>convite venceu ${dBR(vence.toISOString())}</span>`;
  return `<span class="pill p-warn"><i></i>aguardando · vence ${dBR(vence.toISOString())}</span>`;
}
function convidar(pre) {
  pre = pre || {};
  abrirModal('Convidar pessoa para ' + PROJ.nome, `
    <div class="grade g2"><div><label class="lbl" for="cv-e">E-mail</label><input id="cv-e" type="email" class="in" maxlength="254" value="${esc(pre.email || '')}" placeholder="nome@exemplo.com"></div>
      <div><label class="lbl" for="cv-n">Nome</label><input id="cv-n" class="in" maxlength="120" value="${esc(pre.nome || '')}" placeholder="como você chama a pessoa"></div>
      <div><label class="lbl" for="cv-f">Função</label><input id="cv-f" class="in" maxlength="60" list="cv-fs" value="${esc(pre.funcao || '')}"><datalist id="cv-fs"><option>Arquiteto(a)</option><option>Estagiário(a)</option><option>Projetista</option><option>Renderista</option></datalist></div>
      <div><label class="lbl" for="cv-t">Telefone / WhatsApp</label><input id="cv-t" class="in" maxlength="40" inputmode="tel" value="${esc(pre.telefone || '')}"></div></div>
    <div class="aviso" style="font-size:12.5px">A pessoa recebe um e-mail com o botão <b>Aceitar convite</b>, entra com Google ou cria uma senha, preenche o cadastro do AI.arq e aceita os termos. Depois disso ela já está no projeto.</div>
    <div class="rodape"><button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn btn-d" id="cv-ok" onclick="enviarConvite()">Enviar convite</button></div>`);
}
async function enviarConvite() {
  const corpo = { email: $('cv-e').value.trim(), nome: $('cv-n').value.trim() || null, funcao: $('cv-f').value.trim() || null, telefone: $('cv-t').value.trim() || null };
  if (!corpo.email) return toast('Informe o e-mail.', true);
  $('cv-ok').disabled = true;
  const { data: { session } } = await sb.auth.getSession();
  let r, d = {};
  try {
    r = await fetch(`${window.API_BASE}/api/escritorio/projetos/${PROJ.id}/convites`, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token }, body: JSON.stringify(corpo) });
    try { d = await r.json(); } catch (_) {}
  } catch (_) { $('cv-ok').disabled = false; return toast('Sem conexão com o servidor. Tente de novo.', true); }
  $('cv-ok').disabled = false;
  if (!r.ok) return toast(d.detail || 'Não deu pra convidar agora.', true);
  // A11: o link não pode se perder se a releitura falhar
  try { await recarregar(); } catch (e) { console.error(e); }
  const porque = {
    teto_conta: 'Hoje você já mandou muitos convites por e-mail (limite contra spam).',
    teto_destino: 'Esse e-mail já recebeu convites deste projeto hoje.',
    nao_contou: 'Não consegui conferir o limite de e-mails agora.',
    email_falhou: 'O e-mail não saiu agora.',
  }[d.motivo_sem_email] || 'O e-mail não saiu agora.';
  abrirModal(d.email_enviado ? 'Convite enviado' : 'Convite criado, e-mail não saiu', `<p style="margin:0;font-size:14px">${d.email_enviado ? 'O e-mail saiu para <b>' + esc(corpo.email) + '</b>.' : '<b>' + esc(porque) + '</b> O convite foi criado: mande o link abaixo pela conversa que vocês já usam.'}</p>
    <div><label class="lbl" for="cv-link">Link do convite (vale 14 dias, serve uma vez)</label><input id="cv-link" class="in" readonly value="${esc(d.link)}" onclick="this.select()"></div>
    <p class="sub" style="margin:0">Pode mandar pelo WhatsApp também. Quem abrir o link entra neste projeto — mande só pra pessoa certa.</p>
    <div class="rodape"><button class="btn" onclick="copiarLink()">Copiar link</button><button class="btn btn-d" onclick="fecharModal()">Pronto</button></div>`);
}
function copiarLink() { const i = $('cv-link'); try { navigator.clipboard.writeText(i.value).then(() => toast('Link copiado'), () => { i.select(); toast('Selecionei o link: copie com Ctrl+C'); }); } catch (_) { i.select(); } }
function reenviar(id) { const m = MEMBROS.find((x) => x.id === id); convidar({ email: m.email, nome: m.nome, funcao: m.funcao, telefone: m.telefone }); }
function editarPessoa(id) {
  const m = MEMBROS.find((x) => x.id === id);
  abrirModal('Dados de ' + curto(m), `
    <div class="grade g2"><div><label class="lbl" for="pe-n">Nome</label><input id="pe-n" class="in" maxlength="120" value="${esc(m.nome || '')}"></div>
      <div><label class="lbl" for="pe-f">Função</label><input id="pe-f" class="in" maxlength="60" value="${esc(m.funcao || '')}"></div>
      <div><label class="lbl">E-mail</label><input class="in" readonly value="${esc(m.email || '')}" style="background:#F8FAFC"><span class="sub" style="display:block">${m.status === 'ativo' ? 'É o e-mail do convite. Pra trocar, convide o e-mail novo.' : 'Pra trocar, cancele e convide o e-mail certo.'}</span></div>
      <div><label class="lbl" for="pe-t">Telefone / WhatsApp</label><input id="pe-t" class="in" maxlength="40" inputmode="tel" value="${esc(m.telefone || '')}"></div></div>
    <div><label class="lbl" for="pe-o">Observação (só você vê)</label><textarea id="pe-o" rows="2" class="in" maxlength="1000">${esc(NOTAS[id] || '')}</textarea>
      <span class="sub" style="display:block">Valor combinado fica no financeiro, não aqui.</span></div>
    <div class="rodape"><button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn btn-d" onclick="salvarPessoa('${id}')">Salvar</button></div>`);
}
async function salvarPessoa(id) {
  const mud = { nome: $('pe-n').value.trim() || null, funcao: $('pe-f').value.trim() || null, telefone: $('pe-t').value.trim() || null };
  const { error } = await sb.from('escritorio_membros').update(mud).eq('id', id);
  if (error) return falhou(error, 'Não salvei');
  const obs = $('pe-o').value.trim();
  const n = obs
    ? await sb.from('escritorio_membro_notas').upsert({ membro_id: id, projeto_id: PROJ.id, observacao: obs, atualizado_em: new Date().toISOString() })
    : await sb.from('escritorio_membro_notas').delete().eq('membro_id', id);
  if (n.error) return falhou(n.error, 'Salvei os dados, mas não a observação');
  fecharModal(); await recarregar(); toast('Dados salvos');
}
function tirar(id) {
  const m = MEMBROS.find((x) => x.id === id), conv = m.status === 'convidado';
  abrirModal(conv ? 'Cancelar convite' : 'Tirar ' + curto(m) + ' do projeto', `<p style="margin:0;font-size:14px">${conv ? 'O link do convite de <b>' + esc(nomeDe(m)) + '</b> deixa de funcionar.' : '<b>' + esc(nomeDe(m)) + '</b> perde o acesso a este projeto na hora. As tarefas continuam no quadro, pra você passar a outra pessoa.'}</p>
    <div class="rodape"><button class="btn" onclick="fecharModal()">Voltar</button><button class="btn btn-r" onclick="confirmarTirar('${id}')">${conv ? 'Cancelar convite' : 'Tirar do projeto'}</button></div>`);
}
async function confirmarTirar(id) {
  const m = MEMBROS.find((x) => x.id === id);
  // 🔒 A7: "cancelar convite" numa tela velha apagava quem JÁ tinha entrado. Só apaga se
  // ainda for convite (o banco também só deixa apagar quem não está ativo) e confere a contagem.
  const q = m.status === 'convidado'
    ? sb.from('escritorio_membros').delete({ count: 'exact' }).eq('id', id).eq('status', 'convidado')
    : sb.from('escritorio_membros').update({ status: 'removido', removido_em: new Date().toISOString() }, { count: 'exact' }).eq('id', id);
  const { error, count } = await q;
  if (error) return falhou(error, 'Não deu');
  fecharModal();
  try { await recarregar(); } catch (e) { return falhou(e, 'Feito, mas não consegui atualizar a lista'); }
  if (!count) return toast(m.status === 'convidado' ? 'Essa pessoa já tinha entrado no projeto. Atualizei a lista.' : 'Nada mudou: atualizei a lista.', true);
  toast(m.status === 'convidado' ? 'Convite cancelado' : curto(m) + ' saiu do projeto');
}

// ══════════════ início ══════════════
(async function () {
  let sessao = null;
  try { sessao = (await sb.auth.getSession()).data.session; } catch (_) {}
  if (!sessao) { location.href = 'login.html?redirect=escritorio.html'; return; }
  EU = { id: sessao.user.id, email: sessao.user.email };
  if (window.trackEvent) trackEvent('view_escritorio');
  navegar();
})();
</script>
<script src="cookie-consent.js" defer></script>
</body>
</html>
