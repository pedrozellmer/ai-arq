<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="icon" type="image/x-icon" href="favicon-v2.ico">
<link rel="apple-touch-icon" href="apple-touch-icon-v2.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI.arq - Cliente (admin)</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="/tailwind.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js" integrity="sha384-qafw21c/iciq0VXsi9FzkfoQv5I/V0iqE4lSNcKXPnW9/UTJLnv5CcN4FHxVLnKg" crossorigin="anonymous"></script>
<script src="toast.js"></script>
<script src="aiarq-utils.js"></script>
<style>
  body { font-family: 'Inter', sans-serif; }
  .gradient-main { background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%); }
</style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased min-h-screen">

<!-- LOADING / ACCESS GATE -->
<div id="access-gate" class="fixed inset-0 z-[100] bg-white flex items-center justify-center">
  <div id="gate-loading" class="text-center">
    <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl gradient-main text-white mb-4">
      <svg class="w-7 h-7 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
    </div>
    <p class="text-sm text-gray-500">Verificando acesso...</p>
  </div>
  <div id="gate-denied" class="hidden text-center px-6">
    <p class="text-lg font-semibold text-gray-900 mb-1">Acesso restrito</p>
    <p class="text-sm text-gray-500">Redirecionando...</p>
  </div>
</div>

<!-- CONTENT -->
<div id="content" class="hidden max-w-3xl mx-auto px-4 py-6">
  <!-- Top bar -->
  <div class="flex items-center justify-between mb-6">
    <a href="admin.html" onclick="if(document.referrer.includes('admin.html')){history.back();return false;}" class="inline-flex items-center gap-2 text-sm text-gray-500 hover:text-gray-800">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 15l-3-3m0 0l3-3m-3 3h8M3 12a9 9 0 1118 0 9 9 0 01-18 0z"/></svg>
      Voltar ao admin
    </a>
    <span class="text-xs text-gray-400">Vis&atilde;o do administrador</span>
  </div>

  <!-- User header -->
  <div id="user-header" class="rounded-2xl border bg-white p-5 mb-5">
    <p class="text-gray-400 text-sm">Carregando...</p>
  </div>

  <!-- Aviso de leitura que falhou (secao vazia por erro != cliente nao fez) -->
  <div id="ficha-falhas" class="hidden rounded-xl border border-amber-300 bg-amber-50 p-4 mb-5 text-sm"></div>

  <!-- O que essa pessoa fez, de relance -->
  <div id="ficha-chips" class="mb-6"></div>

  <!-- O que ela RESPONDEU -->
  <section id="sec-nps" class="mb-6"></section>
  <section id="sec-mensagens" class="mb-6"></section>
  <section id="sec-pesquisa" class="mb-6"></section>

  <!-- Projects -->
  <div class="flex items-center justify-between mb-3">
    <h2 class="text-lg font-bold text-gray-900">Projetos</h2>
    <span id="proj-count" class="text-sm text-gray-400"></span>
  </div>
  <div id="projects-box"><p class="text-gray-400 text-sm">Carregando projetos...</p></div>

  <!-- O que ela FEZ dentro do produto -->
  <section id="sec-revisao" class="mt-6 mb-6"></section>
  <section id="sec-entregaveis" class="mb-6"></section>
  <section id="sec-chat" class="mb-6"></section>
  <!-- 31/08 (auditoria): o backend JA manda `lead_chat` e `notas`, e a
       tela nunca mostrava nenhum dos dois — dado buscado, trafegado e
       jogado fora. Pior: a tarja de falha cita secoes que nao existiam
       na tela, entao um erro nelas apontava pro nada. -->
  <section id="sec-lead-chat" class="mb-6"></section>
  <section id="sec-notas" class="mb-6"></section>
  <section id="sec-cashback" class="mb-6"></section>
  <section id="sec-emails" class="mb-6"></section>
  <section id="sec-timeline" class="mb-10"></section>
</div>

<script>
const API_BASE = window.API_BASE;
// 28/07: repo é público — só a impressão digital do e-mail do admin.
const ADMIN_EMAIL_HASH = '97bda6eb7aa5b5426da844969ef4d756a77595bc18d12e5a49240598e89b74c2';
const esc = window.escapeHtml || (s => String(s==null?'':s));
const _fmtDate = iso => { if(!iso) return '--'; try { return window.fmtDataBR(iso); } catch(e){ return '--'; } };
const _fmtDateTime = iso => { if(!iso) return '--'; try { return window.fmtBR(iso, {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); } catch(e){ return '--'; } };

// DDD do WhatsApp → UF (mesmo mapa/guard do admin). Só aproximação por DDD.
const DDD_UF = {'11':'SP','12':'SP','13':'SP','14':'SP','15':'SP','16':'SP','17':'SP','18':'SP','19':'SP','21':'RJ','22':'RJ','24':'RJ','27':'ES','28':'ES','31':'MG','32':'MG','33':'MG','34':'MG','35':'MG','37':'MG','38':'MG','41':'PR','42':'PR','43':'PR','44':'PR','45':'PR','46':'PR','47':'SC','48':'SC','49':'SC','51':'RS','53':'RS','54':'RS','55':'RS','61':'DF','62':'GO','64':'GO','63':'TO','65':'MT','66':'MT','67':'MS','68':'AC','69':'RO','71':'BA','73':'BA','74':'BA','75':'BA','77':'BA','79':'SE','81':'PE','87':'PE','82':'AL','83':'PB','84':'RN','85':'CE','88':'CE','86':'PI','89':'PI','91':'PA','93':'PA','94':'PA','92':'AM','97':'AM','95':'RR','96':'AP','98':'MA','99':'MA'};
const OG_SRC_LABEL = { google:'🔍 Google', instagram:'📷 Instagram', facebook:'📘 Facebook', linkedin:'💼 LinkedIn', indicacao:'🤝 Indicação', evento:'🎤 Evento', blog:'📝 Blog', anuncio:'📢 Anúncio', youtube:'▶️ YouTube', outro:'✏️ Outro' };
function _dddToUf(w){ if(!w) return null; let d=String(w).replace(/\D/g,''); if(d.length>=12 && d.slice(0,2)==='55') d=d.slice(2); if(d.length<10) return null; return DDD_UF[d.slice(0,2)]||null; }

function getParam(name){ return new URLSearchParams(location.search).get(name); }

async function checkAdminAccess(){
  try {
    const { data:{ session } } = await sbClient.auth.getSession();
    if(!session){ location.href='login.html'; return false; }
    if(!(await window.aiarqEmailMatches(session.user.email, ADMIN_EMAIL_HASH))){
      document.getElementById('gate-loading').classList.add('hidden');
      document.getElementById('gate-denied').classList.remove('hidden');
      setTimeout(()=>location.href='dashboard.html', 1500);
      return false;
    }
    document.getElementById('access-gate').classList.add('hidden');
    document.getElementById('content').classList.remove('hidden');
    return true;
  } catch(e){ console.error(e); location.href='login.html'; return false; }
}

function statusBadge(u){
  if(!u.email_confirmed_at) return '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-gray-100 text-gray-700 text-xs font-medium">Email não confirmado</span>';
  if(!u.has_profile) return '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-yellow-100 text-yellow-800 text-xs font-medium">Cadastro incompleto</span>';
  return '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-green-100 text-green-800 text-xs font-medium">Cadastro completo</span>';
}

function renderHeader(u){
  const box = document.getElementById('user-header');
  const uf = _dddToUf(u.whatsapp);
  const nome = u.full_name || '(sem nome)';
  const inicial = (u.full_name || u.email || '?').trim().charAt(0).toUpperCase();
  // WhatsApp com msg pronta
  let waBtn = '';
  if(u.whatsapp){
    let n = String(u.whatsapp).replace(/\D/g,''); if(n && n.indexOf('55')!==0 && (n.length===10||n.length===11)) n='55'+n;
    const fn = (u.full_name||'').trim().split(/\s+/)[0]||'';
    const msg = fn ? ('Oi '+fn+'! Aqui é do AI.arq 🙂') : ('Oi! Aqui é do AI.arq 🙂');
    waBtn = `<a href="https://wa.me/${n}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-green-100 hover:bg-green-200 text-green-700 text-sm font-medium">WhatsApp</a>`;
  }
  const campos = [
    ['Empresa', esc(u.company||'--')],
    ['Cargo / área', esc([u.user_role,u.area].filter(Boolean).join(' · ') || '--')],
    ['WhatsApp', u.whatsapp ? (esc(u.whatsapp) + (uf?` <span class="text-gray-400">(${uf} — aprox. DDD)</span>`:'')) : '--'],
    ['Como conheceu', u.referral_source ? (OG_SRC_LABEL[u.referral_source] || esc(u.referral_source)) + (u.referral_detail?` <span class="text-gray-400 italic">&ldquo;${esc(u.referral_detail)}&rdquo;</span>`:'') : '--'],
    ['Cadastro', _fmtDateTime(u.auth_created_at || u.profile_created_at)],
    ['Último acesso', u.last_sign_in_at ? _fmtDateTime(u.last_sign_in_at) : 'nunca entrou'],
    ['Projetos', `${u.num_projects!=null?u.num_projects:'--'}${Number(u.done_count)?` · ${u.done_count} ok`:''}${Number(u.error_count)?` · ${u.error_count} erro`:''}`],
    ['Emails enviados', u.emails_sent!=null ? String(u.emails_sent) : '--'],
  ];
  box.innerHTML = `
    <div class="flex items-start gap-4">
      <div class="shrink-0 w-14 h-14 rounded-2xl gradient-main text-white flex items-center justify-center text-xl font-bold">${esc(inicial)}</div>
      <div class="min-w-0 flex-1">
        <div class="flex items-center gap-2 flex-wrap">
          <h1 class="text-xl font-bold text-gray-900 truncate">${esc(nome)}</h1>
          ${statusBadge(u)}
        </div>
        <div class="text-sm text-gray-500 mt-0.5">${esc(u.email||'--')}</div>
        <div class="flex items-center gap-2 mt-3">
          ${waBtn}
          <button onclick="navigator.clipboard.writeText('${esc(u.email||'')}');this.textContent='Copiado!';setTimeout(()=>this.textContent='Copiar e-mail',1200)" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium">Copiar e-mail</button>
        </div>
      </div>
    </div>
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-x-4 gap-y-3 mt-5 pt-5 border-t text-sm">
      ${campos.map(c=>`<div><div class="text-[11px] uppercase tracking-wide text-gray-400">${c[0]}</div><div class="text-gray-800 mt-0.5">${c[1]}</div></div>`).join('')}
    </div>`;
}

function projBadge(s){
  const map = { done:['bg-green-100 text-green-800','concluído'], error:['bg-red-100 text-red-700','erro'], processing:['bg-blue-100 text-blue-700','processando'], queued:['bg-gray-100 text-gray-600','na fila'] };
  const m = map[s] || ['bg-gray-100 text-gray-600', s||'--'];
  return `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium ${m[0]}">${esc(m[1])}</span>`;
}

function projCard(p){
  const jid = String(p.job_id||'');
  const nome = esc(p.project_name || p.typology || 'Projeto');
  const warn = p.warnings ? `<span class="text-amber-600" title="${esc(String(p.warnings))}">⚠ avisos</span>` : '';
  return `<div class="border rounded-xl p-4 mb-3 bg-white">
    <div class="flex items-start justify-between gap-2 flex-wrap">
      <div class="min-w-0">
        <div class="font-semibold text-gray-900">${nome}</div>
        <div class="text-xs text-gray-500 flex flex-wrap items-center gap-x-2 gap-y-0.5 mt-1">
          ${projBadge(p.status)}
          <span>${_fmtDate(p.created_at)}</span>
          <span>${(p.items_count!=null?p.items_count:'--')} itens</span>
          ${p.typology?`<span>${esc(p.typology)}</span>`:''}
          ${warn}
          <span class="text-gray-300 font-mono">${jid.slice(0,8)}</span>
        </div>
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        <button onclick="toggleRaiox('${jid}', this)" class="px-2.5 py-1.5 rounded-md bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-medium">Raio-X</button>
        ${p.status==='done'?`<button onclick="downloadProtected('${API_BASE}/api/download/${jid}','quantitativos_${jid}.xlsx')" class="px-2.5 py-1.5 rounded-md bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-medium">Planilha</button>`:''}
        <a href="projeto.html?job_id=${encodeURIComponent(jid)}" target="_blank" rel="noopener" class="px-2.5 py-1.5 rounded-md bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-medium">Abrir projeto</a>
      </div>
    </div>
    <div id="rx-${jid}" class="hidden mt-3 pt-3 border-t text-xs"></div>
  </div>`;
}

// Raio-X sob demanda: medido (branco) vs a revisar (laranja) — mesmo sistema do cliente.
async function toggleRaiox(jid, btn){
  const box = document.getElementById('rx-'+jid);
  if(!box) return;
  if(!box.classList.contains('hidden')){ box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  box.innerHTML = '<span class="text-gray-400">Carregando raio-x...</span>';
  try {
    const res = await authFetch(`${API_BASE}/api/items/${jid}`);
    const d = await res.json();
    if(!res.ok) throw new Error(d.detail || 'erro');
    const items = d.items || [];
    const medido = items.filter(i=>i.confidence==='confirmado').length;
    const est = items.length - medido;
    const pctM = items.length ? Math.round(medido*100/items.length) : 0;
    box.innerHTML = `
      <div class="flex flex-wrap items-center gap-4">
        <span class="inline-flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-white border border-gray-400"></span> <b>${medido}</b> medido</span>
        <span class="inline-flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-amber-400"></span> <b>${est}</b> a revisar</span>
        <span class="text-gray-500">${pctM}% medido de ${items.length} itens</span>
      </div>`;
  } catch(e){ box.innerHTML = `<span class="text-red-500">Erro: ${esc(String(e.message||e))}</span>`; }
}

async function loadUserPage(){
  const id = getParam('id');
  if(!id){ document.getElementById('user-header').innerHTML='<p class="text-red-500 text-sm">Sem id de usuário na URL.</p>'; return; }

  // Dados do usuário (RPC admin, tem trava interna de admin)
  try {
    const { data, error } = await sbClient.rpc('admin_list_all_signups');
    if(error) throw error;
    const u = (data||[]).find(x=>String(x.user_id)===String(id));
    if(!u){ document.getElementById('user-header').innerHTML='<p class="text-amber-600 text-sm">Usuário não encontrado.</p>'; }
    else renderHeader(u);
  } catch(e){
    document.getElementById('user-header').innerHTML = `<p class="text-red-500 text-sm">Erro ao carregar o usuário: ${esc(String(e.message||e))}</p>`;
  }

  // Projetos do usuário (bypass admin no endpoint existente)
  const pbox = document.getElementById('projects-box');
  try {
    const res = await authFetch(`${API_BASE}/api/projects/by-user/${encodeURIComponent(id)}`);
    const d = await res.json();
    if(!res.ok) throw new Error(d.detail || 'erro');
    let projs = d.projects || [];
    projs.sort((a,b)=>(Date.parse(b.created_at||'')||0)-(Date.parse(a.created_at||'')||0));
    document.getElementById('proj-count').textContent = projs.length + (projs.length===1?' projeto':' projetos');
    pbox.innerHTML = projs.length ? projs.map(projCard).join('') : '<p class="text-gray-500 text-sm border rounded-xl p-4 bg-white">Nenhum projeto ainda.</p>';
  } catch(e){
    pbox.innerHTML = `<p class="text-red-500 text-sm">Erro ao carregar projetos: ${esc(String(e.message||e))}</p>`;
  }
}

// ═══════════════════════════════════════════════════════════════════════
// FICHA COMPLETA — "tudo que o cara respondeu, tudo que ele fez" (Pedro,
// 31/08/2026). Uma chamada so: /api/admin/usuario/{id ou email}.
//
// 🪤 A regra desta tela: secao vazia porque a LEITURA FALHOU nao pode parecer
// "o cliente nao fez isso". O backend manda `_falhas` e aqui isso vira uma
// tarja amarela no topo — sem ela, a ficha vira conclusao errada sobre gente
// de verdade.
// ═══════════════════════════════════════════════════════════════════════
function _card(titulo, contador, corpoHtml, vazioTxt){
  const cnt = (contador === null || contador === undefined) ? '' :
    `<span class="text-sm text-gray-400">${contador}</span>`;
  return `<div class="flex items-center justify-between mb-3">
      <h2 class="text-lg font-bold text-gray-900">${titulo}</h2>${cnt}</div>
    ${corpoHtml || `<p class="text-gray-500 text-sm border rounded-xl p-4 bg-white">${vazioTxt}</p>`}`;
}

function _linhas(itens, fn){
  if(!itens || !itens.length) return '';
  return '<div class="rounded-xl border bg-white divide-y">' +
    itens.map(fn).join('') + '</div>';
}

function _notaCor(n){
  n = Number(n);
  if(n >= 9) return 'bg-emerald-100 text-emerald-800';
  if(n >= 7) return 'bg-amber-100 text-amber-800';
  return 'bg-red-100 text-red-800';
}

function renderChips(r){
  // O painel de "usou / nao usou" que o Pedro pediu: o produto inteiro numa
  // faixa. Verde = usou; cinza = nunca.
  const itens = [
    ['Subiu projeto',        r.projetos > 0,                 r.projetos + ''],
    ['Concluiu',             r.projetos_concluidos > 0,      r.projetos_concluidos + ''],
    ['Baixou / revisou item', r.revisou,                     Object.values(r.revisoes_por_acao||{}).reduce((a,b)=>a+b,0)+''],
    ['Mandou planilha revisada', r.planilhas_revisadas_enviadas > 0, r.planilhas_revisadas_enviadas+''],
    ['Usou o chat',          r.usou_chat,                    ''],
    ['Gerou memorial',       r.gerou_memorial,               ''],
    ['Gerou cronograma',     r.gerou_cronograma,             ''],
    ['Comparativo fornecedor', r.gerou_comparativo,          ''],
    ['Cadastrou cliente final', r.cadastrou_cliente_final,   ''],
    ['Avaliou (NPS)',        r.respondeu_nps > 0,            r.melhor_nps != null ? ('nota '+r.melhor_nps) : ''],
    ['Falou com a gente',    r.mandou_mensagem > 0,          r.mandou_mensagem+''],
  ];
  const chips = itens.map(([rot, usou, extra]) => {
    const cls = usou ? 'bg-emerald-50 border-emerald-200 text-emerald-800'
                     : 'bg-gray-50 border-gray-200 text-gray-400';
    const marca = usou ? '&#10003;' : '&#8212;';
    const ex = (usou && extra) ? ` <span class="opacity-70">(${esc(extra)})</span>` : '';
    return `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg border text-xs font-medium ${cls}">
      <span aria-hidden="true">${marca}</span> ${esc(rot)}${ex}</span>`;
  }).join('');
  document.getElementById('ficha-chips').innerHTML =
    `<p class="text-xs font-semibold uppercase tracking-wide text-gray-400 mb-2">O que essa pessoa usou do produto</p>
     <div class="flex flex-wrap gap-2">${chips}</div>`;
}

function renderFicha(d){
  const r = d.resumo || {};
  renderChips(r);

  // Tarja de leitura que falhou
  if(d._falhas && d._falhas.length){
    const box = document.getElementById('ficha-falhas');
    box.innerHTML = '<b>&#9888; Parte da ficha nao pode ser lida</b>' +
      '<p class="text-xs text-amber-800/80 mt-1">Estas secoes aparecem vazias por FALHA, nao porque a pessoa nao usou:</p>' +
      '<ul class="list-disc ml-5 mt-1 text-xs">' +
      d._falhas.map(f => `<li>${esc(f)}</li>`).join('') + '</ul>';
    box.classList.remove('hidden');
  }

  // ── Avaliacoes (NPS) ──
  document.getElementById('sec-nps').innerHTML = _card(
    'Avalia&ccedil;&otilde;es', (d.nps||[]).length || null,
    _linhas(d.nps, n => {
      const et = n.stage_ratings ? Object.entries(n.stage_ratings)
        .map(([k,v]) => `${esc(k)} ${esc(v)}/5`).join(' &middot; ') : '';
      return `<div class="p-4">
        <div class="flex items-center gap-2 flex-wrap">
          <span class="inline-flex items-center justify-center w-9 h-9 rounded-lg font-bold ${_notaCor(n.score)}">${esc(n.score)}</span>
          <span class="text-xs text-gray-500">${_fmtDateTime(n.created_at)}</span>
          ${n.context ? `<span class="text-xs px-2 py-0.5 rounded bg-gray-100 text-gray-600">${esc(n.context)}</span>` : ''}
        </div>
        ${n.comment ? `<p class="text-sm text-gray-800 mt-2 italic">&ldquo;${esc(n.comment)}&rdquo;</p>` : '<p class="text-xs text-gray-400 mt-2">(sem coment&aacute;rio)</p>'}
        ${et ? `<p class="text-xs text-gray-500 mt-1">${et}</p>` : ''}
      </div>`;
    }),
    'Nunca avaliou. Vale pedir &mdash; s&oacute; 5 pessoas avaliaram em toda a hist&oacute;ria do produto.');

  // ── Lead do chat publico (31/08: buscado e nunca mostrado) ──
  document.getElementById('sec-lead-chat').innerHTML = _card(
    'Deixou contato no chat do site', (d.lead_chat||[]).length || null,
    _linhas(d.lead_chat, l => `<div class="p-4">
      <div class="flex items-center gap-2 flex-wrap text-xs text-gray-500">
        <span>${_fmtDateTime(l.created_at)}</span>
        ${l.nome ? `<span class="px-2 py-0.5 rounded bg-gray-100">${esc(l.nome)}</span>` : ''}
      </div>
      <p class="text-sm text-gray-700 mt-1 whitespace-pre-wrap">${esc(l.mensagem||l.message||'')}</p>
    </div>`),
    'Nunca deixou contato pelo chat p&uacute;blico.');

  // ── Notas que escreveu nos itens (31/08: buscado e nunca mostrado) ──
  document.getElementById('sec-notas').innerHTML = _card(
    'Notas que escreveu em itens', (d.notas||[]).length || null,
    _linhas(d.notas, n => `<div class="p-4">
      <div class="flex items-center gap-2 flex-wrap text-xs text-gray-500">
        <span>${_fmtDateTime(n.created_at)}</span>
        ${n.job_id ? `<a class="text-indigo-600 hover:underline" href="projeto.html?job_id=${esc(n.job_id)}">${esc(String(n.job_id).slice(0,8))}</a>` : ''}
      </div>
      <p class="text-sm text-gray-700 mt-1 whitespace-pre-wrap">${esc(n.note||'')}</p>
    </div>`),
    'Nunca escreveu nota em item nenhum.');

  // ── Mensagens ──
  document.getElementById('sec-mensagens').innerHTML = _card(
    'Mensagens que mandou', (d.mensagens||[]).length || null,
    _linhas(d.mensagens, m => `<div class="p-4">
      <div class="flex items-center gap-2 flex-wrap text-xs text-gray-500">
        <span class="px-2 py-0.5 rounded bg-gray-100">${esc(m.message_type||'contato')}</span>
        <span>${_fmtDateTime(m.created_at)}</span>
        ${m.replied_at ? '<span class="text-emerald-700">respondida</span>' : '<span class="text-amber-700">sem resposta</span>'}
      </div>
      ${m.subject ? `<p class="text-sm font-medium text-gray-900 mt-1">${esc(m.subject)}</p>` : ''}
      <p class="text-sm text-gray-700 mt-1 whitespace-pre-wrap">${esc(m.message||'')}</p>
    </div>`),
    'Nunca escreveu pra gente.');

  // ── Pesquisa pos-processamento ──
  document.getElementById('sec-pesquisa').innerHTML = _card(
    'Pesquisa p&oacute;s-processamento', (d.pesquisa||[]).length || null,
    _linhas(d.pesquisa, p => `<div class="p-4 text-sm">
      <span class="text-gray-500">${esc(p.question_key||'')}:</span>
      <span class="text-gray-900 font-medium">${esc(p.answer||'')}</span>
      <span class="text-xs text-gray-400 ml-2">${_fmtDate(p.created_at)}</span></div>`),
    'Nao respondeu. (Esta pesquisa esta com ZERO resposta no produto inteiro.)');

  // ── Revisao ──
  const ac = r.revisoes_por_acao || {};
  const acTxt = Object.keys(ac).length
    ? Object.entries(ac).map(([k,v]) => `${v} ${k === 'edit' ? 'corre&ccedil;&otilde;es' : k === 'reject' ? 'exclus&otilde;es' : 'aprova&ccedil;&otilde;es'}`).join(' &middot; ')
    : '';
  document.getElementById('sec-revisao').innerHTML = _card(
    'Revis&atilde;o dos itens', acTxt || null,
    _linhas((d.revisoes||[]).slice(0, 40), v => {
      const e = v.edits || {};
      const antes = e._antes || {};
      const rot = v.action === 'edit' ? 'corrigiu' : v.action === 'reject' ? 'EXCLUIU' : 'aprovou';
      const cor = v.action === 'reject' ? 'bg-red-100 text-red-800'
                : v.action === 'edit' ? 'bg-indigo-100 text-indigo-800'
                : 'bg-gray-100 text-gray-600';
      let det = '';
      if(antes.description){
        det = `<p class="text-sm text-gray-800 mt-1">${esc(antes.description)}</p>`;
        if(antes.quantity != null) det += `<p class="text-xs text-gray-500">motor: ${esc(antes.quantity)} ${esc(antes.unit||'')}` +
          (e.quantity != null ? ` &rarr; cliente: <b>${esc(e.quantity)}</b>` : '') + '</p>';
      }
      return `<div class="p-4">
        <div class="flex items-center gap-2 text-xs">
          <span class="px-2 py-0.5 rounded font-semibold ${cor}">${rot}</span>
          <span class="text-gray-400">${_fmtDateTime(v.reviewed_at)}</span>
        </div>${det}
        ${v.comment ? `<p class="text-sm italic text-gray-600 mt-1">&ldquo;${esc(v.comment)}&rdquo;</p>` : ''}
      </div>`;
    }),
    'Nunca abriu a revis&atilde;o. (54% dos projetos nunca sao revisados.)');

  // ── Entregaveis ──
  const ent = [];
  (d.memoriais||[]).forEach(m => ent.push(['Memorial descritivo', m.job_id, m.updated_at]));
  (d.cronogramas||[]).forEach(c => ent.push(['Cronograma', c.job_id, c.created_at]));
  (d.cotacoes||[]).forEach(c => ent.push(
    ['Comparativo: ' + (c.supplier_name || 'fornecedor'), c.job_id, c.uploaded_at]));
  (d.planilhas_revisadas||[]).forEach(p => ent.push(
    ['Planilha revisada enviada (' + (p.n_alterados||0) + ' alterados)', p.job_id, p.created_at]));
  (d.clientes_finais||[]).forEach(c => ent.push(
    ['Cliente final: ' + (c.client_name || c.client_company || '?'), c.job_id, c.created_at]));
  document.getElementById('sec-entregaveis').innerHTML = _card(
    'Entreg&aacute;veis que gerou', ent.length || null,
    _linhas(ent, ([rot, job, quando]) => `<div class="p-3 text-sm flex items-center justify-between gap-3">
      <span class="text-gray-900">${esc(rot)}</span>
      <span class="text-xs text-gray-400 shrink-0">${job ? esc(String(job).slice(0,8)) + ' &middot; ' : ''}${_fmtDate(quando)}</span>
    </div>`),
    'S&oacute; a planilha. Nunca gerou memorial, cronograma nem comparativo.');

  // ── Chat ──
  document.getElementById('sec-chat').innerHTML = _card(
    'Chat do quantitativo', (d.chat||[]).length || null,
    _linhas((d.chat||[]).slice(0, 20), c => `<div class="p-4">
      <p class="text-sm font-medium text-gray-900">${esc(c.question||'')}</p>
      <p class="text-sm text-gray-600 mt-1 whitespace-pre-wrap">${esc(String(c.answer||'').slice(0,600))}</p>
      <p class="text-xs text-gray-400 mt-1">${_fmtDateTime(c.created_at)}${c.error ? ' &middot; <span class="text-red-600">erro</span>' : ''}</p>
    </div>`),
    'Nunca usou o chat.');

  // ── Cashback ──
  document.getElementById('sec-cashback').innerHTML = _card(
    'Cashback', (d.cashback||[]).length || null,
    _linhas(d.cashback, c => `<div class="p-3 text-sm flex items-center justify-between">
      <span>${esc(c.description || c.source || '')}</span>
      <span class="font-semibold">R$ ${((Number(c.amount_cents)||0)/100).toFixed(2).replace('.', ',')}</span>
    </div>`),
    'Nenhum cr&eacute;dito.');

  // ── E-mails ──
  document.getElementById('sec-emails').innerHTML = _card(
    'E-mails que recebeu', (d.emails||[]).length || null,
    _linhas((d.emails||[]).slice(0, 30), e => `<div class="p-3 text-sm flex items-center justify-between gap-3">
      <span class="text-gray-800 truncate">${esc(e.subject || e.kind || '')}</span>
      <span class="text-xs text-gray-400 shrink-0">${_fmtDate(e.sent_at)}</span>
    </div>`),
    'Nenhum e-mail registrado.');

  // ── Linha do tempo ──
  document.getElementById('sec-timeline').innerHTML = _card(
    'Linha do tempo', (d.eventos||[]).length ? ((d.eventos||[]).length + ' eventos') : null,
    _linhas((d.eventos||[]).slice(0, 60), ev => `<div class="p-2.5 text-xs flex items-center justify-between gap-3">
      <span class="text-gray-700 font-medium">${esc(ev.event||'')}</span>
      <span class="text-gray-400 shrink-0">${_fmtDateTime(ev.created_at)}</span>
    </div>`),
    'Sem eventos. &#9888; a telemetria s&oacute; registra quem aceitou cookie &mdash; aus&ecirc;ncia aqui n&atilde;o prova aus&ecirc;ncia de uso.');
}

async function carregarFicha(chave){
  try {
    const res = await authFetch(`${API_BASE}/api/admin/usuario/${encodeURIComponent(chave)}`);
    const d = await res.json();
    if(!res.ok) throw new Error(d.detail || ('HTTP ' + res.status));
    renderFicha(d);
  } catch(e){
    // 🪤 Falhar aqui nao pode virar tela em branco silenciosa: sem aviso, o
    // Pedro leria "esse cliente nao fez nada".
    const box = document.getElementById('ficha-falhas');
    box.innerHTML = `<b>&#9888; Nao consegui carregar a ficha:</b> ${esc(String(e.message||e))}
      <p class="text-xs mt-1">As se&ccedil;&otilde;es abaixo est&atilde;o vazias por ERRO, n&atilde;o porque a pessoa n&atilde;o usou.</p>`;
    box.classList.remove('hidden');
  }
}

(async function init(){
  const ok = await checkAdminAccess();
  if(ok){
    loadUserPage();
    const id = getParam('id') || getParam('email');
    if(id) carregarFicha(id);
  }
})();
</script>
