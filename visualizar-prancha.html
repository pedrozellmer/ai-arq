<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prancha — AI.arq</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', -apple-system, sans-serif; margin: 0; overflow: hidden; }
    .viewer-container { height: 100vh; display: flex; flex-direction: column; }
    .viewer-toolbar {
      background: #1f2937; color: white; padding: 10px 16px;
      display: flex; align-items: center; gap: 12px;
      font-size: 13px; flex-shrink: 0;
    }
    .viewer-frame { flex: 1; border: none; background: #4b5563; }
  </style>
</head>
<body>

<div class="viewer-container">
  <div class="viewer-toolbar">
    <button onclick="window.close()" class="text-gray-300 hover:text-white flex items-center gap-1">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
      Fechar
    </button>
    <span class="text-gray-500">·</span>
    <span id="filename" class="font-medium truncate flex-1">Carregando...</span>
    <button onclick="downloadPdf()" title="Baixar o PDF original"
      class="text-gray-300 hover:text-white flex items-center gap-1">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      Baixar
    </button>
  </div>
  <iframe id="pdf-frame" class="viewer-frame" title="Prancha PDF"></iframe>
</div>

<script>
const API_BASE = 'https://ai-arq.onrender.com';
const urlParams = new URLSearchParams(window.location.search);
const jobId = urlParams.get('job_id');
const ref = urlParams.get('ref');

if (!jobId || !ref) {
  document.body.innerHTML = '<div style="padding:40px;font-family:Inter;text-align:center;">Parâmetros ausentes (?job_id=...&ref=...)</div>';
} else {
  const pdfUrl = `${API_BASE}/api/sheet/${jobId}?ref=${encodeURIComponent(ref)}`;
  document.getElementById('filename').textContent = decodeURIComponent(ref);
  document.getElementById('pdf-frame').src = pdfUrl;

  // Ajustar título da aba com nome do arquivo
  document.title = decodeURIComponent(ref) + ' — AI.arq';

  window.downloadPdf = function() {
    const a = document.createElement('a');
    a.href = pdfUrl;
    a.download = decodeURIComponent(ref);
    document.body.appendChild(a);
    a.click();
    a.remove();
  };
}
</script>

</body>
</html>
