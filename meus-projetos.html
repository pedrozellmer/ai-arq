<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Projetos — AI.arq</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', -apple-system, sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen">

<div id="gate" class="fixed inset-0 bg-white z-50 flex items-center justify-center">
  <div class="text-center">
    <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-600 mx-auto"></div>
    <p class="mt-3 text-sm text-gray-500">Carregando...</p>
  </div>
</div>

<header class="bg-white border-b">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3">
    <a href="dashboard.html" class="text-gray-400 hover:text-indigo-600">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
    </a>
    <h1 class="font-semibold text-gray-800">Meus projetos</h1>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-6">
  <div id="loading" class="text-center text-gray-500 py-12 text-sm">Carregando...</div>
  <div id="empty" class="hidden text-center text-gray-500 py-12 text-sm">
    Você ainda não tem projetos processados.
    <div class="mt-3"><a href="dashboard.html" class="text-indigo-600 hover:underline">Criar primeiro projeto →</a></div>
  </div>
  <table id="projects-table" class="hidden w-full bg-white rounded-lg border overflow-hidden text-sm">
    <thead class="bg-gray-50 text-xs text-gray-500 uppercase tracking-wide">
      <tr>
        <th class="text-left px-4 py-3">Projeto</th>
        <th class="text-left px-4 py-3">Tipologia</th>
        <th class="text-left px-4 py-3">Itens</th>
        <th class="text-left px-4 py-3">Arquivos</th>
        <th class="text-left px-4 py-3">Status</th>
        <th class="text-left px-4 py-3">Criado</th>
        <th class="text-right px-4 py-3">Ações</th>
      </tr>
    </thead>
    <tbody id="projects-tbody" class="divide-y"></tbody>
  </table>
</main>

<script>
const SUPABASE_URL = 'https://kqjabzwgbfuivzlcfvvu.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtxamFiendnYmZ1aXZ6bGNmdnZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwMDg5NzcsImV4cCI6MjA5MTU4NDk3N30.48xSenZlDV0LfD94ZxwGvX41Kf9Je2n-ouZpJrrCSKI';
const API_BASE = 'https://ai-arq.onrender.com';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

(async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = 'login.html'; return; }
  document.getElementById('gate').classList.add('hidden');

  try {
    const res = await fetch(`${API_BASE}/api/projects/by-user/${session.user.id}`);
    const data = await res.json();
    renderProjects(data.projects || []);
  } catch (e) {
    document.getElementById('loading').textContent = 'Erro: ' + e.message;
  }
})();

function renderProjects(projects) {
  document.getElementById('loading').classList.add('hidden');
  if (!projects.length) {
    document.getElementById('empty').classList.remove('hidden');
    return;
  }
  document.getElementById('projects-table').classList.remove('hidden');
  const tbody = document.getElementById('projects-tbody');
  tbody.innerHTML = projects.map(p => {
    const created = p.created_at ? new Date(p.created_at).toLocaleString('pt-BR', {
      day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
    }) : '--';
    const statusBadge = {
      'done':    '<span class="inline-block px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 text-xs font-medium">Concluído</span>',
      'error':   '<span class="inline-block px-2 py-0.5 rounded-full bg-red-100 text-red-700 text-xs font-medium">Erro</span>',
      'queued':  '<span class="inline-block px-2 py-0.5 rounded-full bg-amber-100 text-amber-700 text-xs font-medium">Na fila</span>',
      'processing': '<span class="inline-block px-2 py-0.5 rounded-full bg-blue-100 text-blue-700 text-xs font-medium">Processando</span>',
    }[p.status] || p.status;

    const actions = p.status === 'done' ? `
      <a href="revisao.html?job_id=${p.job_id}" class="text-indigo-600 hover:text-indigo-800 font-medium">Revisar</a>
      <a href="${API_BASE}/api/download/${p.job_id}" target="_blank" class="ml-3 text-emerald-600 hover:text-emerald-800 font-medium">Baixar</a>
    ` : '—';

    // Busca % revisado em background (não bloqueia render da tabela)
    setTimeout(async () => {
      if (p.status !== 'done') return;
      try {
        const r = await fetch(`${API_BASE}/api/items/${p.job_id}/review-state`);
        const d = await r.json();
        const reviewed = d.count || 0;
        const total = p.items_count || 1;
        const pct = Math.round((reviewed / total) * 100);
        const cell = document.querySelector(`tr[data-job="${p.job_id}"] .review-pct`);
        if (cell) {
          if (reviewed > 0 && reviewed < total) {
            cell.innerHTML = `<span class="text-xs text-indigo-600">${pct}% revisado</span>`;
          } else if (reviewed >= total) {
            cell.innerHTML = '<span class="text-xs text-emerald-600">100% revisado</span>';
          }
        }
      } catch (e) {}
    }, 0);

    // Warnings do motor (prancha órfã, legenda ausente)
    const warnings = Array.isArray(p.warnings) ? p.warnings : [];
    const warningBadge = warnings.length
      ? `<div class="mt-1 inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 text-xs font-medium cursor-help"
           title="${escapeHtml(warnings.join('\n\n'))}">
           ⚠ ${warnings.length} aviso${warnings.length>1?'s':''}: subir arquivo complementar
         </div>`
      : '';

    return `
      <tr class="hover:bg-gray-50" data-job="${escapeHtml(p.job_id)}">
        <td class="px-4 py-3">
          <p class="font-medium text-gray-800">${escapeHtml(p.project_name || 'Sem nome')}</p>
          <p class="text-xs text-gray-400">${escapeHtml(p.job_id)}</p>
          ${warningBadge}
        </td>
        <td class="px-4 py-3 text-gray-600 capitalize">${escapeHtml(p.typology || '--')}</td>
        <td class="px-4 py-3 text-gray-700">${p.items_count || '--'} <span class="review-pct block"></span></td>
        <td class="px-4 py-3 text-gray-600">${p.files_count || 0}</td>
        <td class="px-4 py-3">${statusBadge}</td>
        <td class="px-4 py-3 text-gray-500 text-xs">${created}</td>
        <td class="px-4 py-3 text-right text-sm">${actions}</td>
      </tr>
    `;
  }).join('');
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>

</body>
</html>
