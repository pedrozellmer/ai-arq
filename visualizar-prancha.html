<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prancha — AI.arq</title>
  <meta name="robots" content="noindex,follow">
  <link rel="stylesheet" href="/tailwind.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js" integrity="sha384-qafw21c/iciq0VXsi9FzkfoQv5I/V0iqE4lSNcKXPnW9/UTJLnv5CcN4FHxVLnKg" crossorigin="anonymous"></script>
  <script src="aiarq-utils.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', -apple-system, sans-serif; margin: 0; overflow: hidden; }
    .gradient-main { background: linear-gradient(135deg, #4f46e5 0%, #22D3EE 100%); }
    .viewer-container { height: 100vh; display: flex; flex-direction: column; }
    .viewer-toolbar {
      background: #1f2937; color: white; padding: 10px 16px;
      display: flex; align-items: center; gap: 12px;
      font-size: 13px; flex-shrink: 0;
      border-bottom: 2px solid transparent;
      border-image: linear-gradient(90deg, #4F46E5, #22D3EE) 1;
    }
    .viewer-frame { flex: 1; border: none; background: #4b5563; }
      .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  </style>
</head>
<body>

<div class="viewer-container">
  <!-- 31/08 (auditoria): a página não tinha heading nenhum — leitor de tela
       ficava sem marco de navegação. O h1 fica só pra tecnologia assistiva
       (a barra já mostra o nome do arquivo pra quem enxerga). -->
  <h1 class="sr-only">Visualizador de prancha</h1>
  <div class="viewer-toolbar">
    <div class="flex h-7 w-7 items-center justify-center rounded-lg gradient-main text-white font-bold text-xs" aria-hidden="true">AI</div>
    <button onclick="window.close()" class="text-gray-300 hover:text-indigo-300 flex items-center gap-1">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
      Fechar
    </button>
    <span class="text-gray-500">·</span>
    <span id="filename" class="font-medium truncate flex-1">Carregando...</span>
    <button onclick="downloadPdf()" id="btn-baixar" title="Baixar o arquivo que está sendo exibido"
      class="text-gray-300 hover:text-indigo-300 flex items-center gap-1">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      Baixar
    </button>
  </div>
  <!-- 🚨 REGRA DURA Nº1 (17/09/2026). Quando o que chega é a IMAGEM que a
       gente renderizou do CAD, o cliente precisa saber disso. O botão que o
       trouxe aqui fala em conferir a prancha; entregar um desenho gerado por
       nós sem dizer que é gerado por nós é apresentar desenho como se fosse o
       original. Fica escondido quando o que chega é o PDF do próprio cliente. -->
  <!-- 🩸 17/09 — `hidden` SOZINHO NÃO ESCONDE: nesta folha `[hidden]` (byte
       4699) empata em especificidade com `.flex` (7203) e perde por vir antes.
       Sem o estilo em linha, este selo aparecia SEMPRE — inclusive em cima do
       PDF que o próprio cliente mandou, dizendo que fomos nós que geramos.
       Regra dura nº1 ao contrário. Estilo em linha ganha de qualquer regra da
       folha, sem depender da ordem do build (que é estático).
       🪤 E a classe é `text-sm`, não `text-[13px]`: valor arbitrário de
       Tailwind NÃO existe neste CSS pré-compilado — sairia em 16px calado. -->
  <div id="selo-render" hidden style="display:none"
       class="flex items-start gap-2 bg-amber-50 border-b border-amber-200 px-4 py-2 text-sm text-amber-900">
    <span aria-hidden="true">🖼️</span>
    <span>Esta imagem foi <strong>gerada pelo AI.arq a partir do seu CAD</strong>, só
      para você ver o desenho. Ela mostra <strong>um layout</strong> do arquivo, pode
      trocar fontes, e <strong>não é a medição</strong> — para conferir de verdade,
      abra o arquivo original no seu CAD.</span>
  </div>
  <iframe id="pdf-frame" class="viewer-frame" title="Prancha"></iframe>
</div>

<script>
// API_BASE + sbClient vêm de aiarq-utils.js
const API_BASE = window.API_BASE;
const sbClient = window.sbClient;

const urlParams = new URLSearchParams(window.location.search);
const jobId = urlParams.get('job_id');
const ref = urlParams.get('ref');

let currentBlobUrl = null;  // referência pra revogar no unload

// 🩸 17/09/2026 — o nome do que o servidor ENTREGOU, que não é o mesmo que a
// tela PEDIU. O `ref` nomeia o CAD ("planta.dxf"); o que volta pode ser a
// imagem renderizada dele ("planta.png"). Enquanto isso não era separado, o
// botão Baixar salvava a imagem com extensão .dxf — um arquivo que não abre em
// lugar nenhum. O servidor diz o nome verdadeiro no cabeçalho X-Filename.
let nomeEntregue = null;

function ehRender(nome) {
  return /\.(png|jpe?g)$/i.test(String(nome || ''));
}

// Exibe erro fatal SEM jogar dado do servidor em innerHTML (fix XSS 2026-07-22):
// o texto entra por textContent, imune a payload tipo <img src=x onerror=...>
// que antes vinha refletido no 'detail' do backend.
function showFatal(msg) {
  document.body.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.style.cssText = 'padding:40px;font-family:Inter;text-align:center;';
  const p1 = document.createElement('p');
  p1.textContent = msg;
  const p2 = document.createElement('p');
  p2.style.marginTop = '16px';
  const a = document.createElement('a');
  a.href = 'dashboard.html';
  a.style.cssText = 'color:#4f46e5;text-decoration:underline';
  a.textContent = 'Voltar pro dashboard';
  p2.appendChild(a);
  wrap.appendChild(p1); wrap.appendChild(p2);
  document.body.appendChild(wrap);
}

if (!jobId || !ref) {
  document.body.innerHTML = '<div style="padding:40px;font-family:Inter;text-align:center;">Parâmetros ausentes (?job_id=...&ref=...)</div>';
} else {
  const pdfUrl = `${API_BASE}/api/sheet/${jobId}?ref=${encodeURIComponent(ref)}`;
  document.getElementById('filename').textContent = decodeURIComponent(ref);

  // Ajustar título da aba com nome do arquivo
  document.title = decodeURIComponent(ref) + ' — AI.arq';

  // FIX bug cliente-38 2026-06-02: iframe.src={endpoint protegido} NÃO envia
  // Authorization → 401. Solução: fetch com Bearer, gerar blob URL, atribuir
  // ao iframe. CLAUDE.md item 9.
  async function loadPdfIntoFrame() {
    try {
      const { data: { session } } = await sbClient.auth.getSession();
      if (!session) {
        document.body.innerHTML = '<div style="padding:40px;font-family:Inter;text-align:center;"><p>Sua sessão expirou. <a href="login.html" style="color:#4f46e5;text-decoration:underline">Entrar de novo</a> e voltar.</p></div>';
        return;
      }
      const resp = await fetch(pdfUrl, {
        headers: { 'Authorization': `Bearer ${session.access_token}` }
      });
      if (!resp.ok) {
        let detail = `HTTP ${resp.status}`;
        try { const j = await resp.json(); detail = j.detail || detail; } catch {}
        showFatal('Não consegui abrir a prancha: ' + detail);
        return;
      }
      // O nome VERDADEIRO do que veio — e, com ele, o selo de honestidade.
      nomeEntregue = resp.headers.get('X-Filename') || decodeURIComponent(ref);
      // 🩸 A barra SEMPRE mostra o que CHEGOU, não o que foi pedido. Esta linha
      // vivia dentro do `if` de baixo: quando o servidor entregava a prancha de
      // OUTRO arquivo (o casamento aproximado do backend faz isso), o cliente
      // via um desenho em tela cheia rotulado com o nome que ele clicou.
      document.getElementById('filename').textContent = nomeEntregue;
      if (ehRender(nomeEntregue)) {
        const selo = document.getElementById('selo-render');
        selo.hidden = false;
        selo.style.display = '';   // o atributo sozinho não esconde nesta folha
        document.getElementById('btn-baixar').title =
          'Baixar a imagem gerada (não é o arquivo original)';
      }
      const blob = await resp.blob();
      currentBlobUrl = URL.createObjectURL(blob);
      document.getElementById('pdf-frame').src = currentBlobUrl;
    } catch (e) {
      showFatal('Erro de rede ao carregar: ' + (e && e.message ? e.message : e));
    }
  }
  loadPdfIntoFrame();

  window.downloadPdf = async function() {
    // Se já temos blob carregado, usa direto. Senão refaz o fetch.
    if (currentBlobUrl) {
      const a = document.createElement('a');
      a.href = currentBlobUrl;
      a.download = nomeEntregue || decodeURIComponent(ref);
      document.body.appendChild(a);
      a.click();
      a.remove();
      return;
    }
    const { data: { session } } = await sbClient.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }
    const resp = await fetch(pdfUrl, {
      headers: { 'Authorization': `Bearer ${session.access_token}` }
    });
    if (!resp.ok) return;
    nomeEntregue = resp.headers.get('X-Filename') || nomeEntregue;
    const blob = await resp.blob();
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = nomeEntregue || decodeURIComponent(ref);
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
  };

  window.addEventListener('beforeunload', () => {
    if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
  });
}
</script>

<script src="whatsapp-button.js" defer></script>
</body>
</html>
