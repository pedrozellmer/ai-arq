name: Bancada (pytest)

# 🚨 23/08/2026 (auditoria): a bancada existia e estava APAGADA.
# `pytest backend/tests/` colhia 6 testes de UM arquivo e abortava com
# "I/O operation on closed file" — os outros 17 arquivos (consolidação de
# bitola, cotas do DXF, engine_rules, estrutural, trava de jobs concorrentes,
# revision_feedback) nunca rodavam juntos, e nada no CI os chamava.
# Agora roda a cada push, ANTES do smoke: erro de lógica morre aqui, sem
# esperar o deploy chegar na produção.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  bancada:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pyflakes esprima

      # A regra que nasceu do deploy 8d597a6 (NameError no boot, 21/08):
      # nome indefinido não aparece no py_compile, só no pyflakes.
      - name: pyflakes (nome indefinido derruba o boot)
        run: |
          python -m pyflakes backend/*.py | grep "undefined name" && exit 1 || true

      - name: pytest
        working-directory: backend
        run: python -m pytest tests/ -q

      # 🚨 25/08/2026 (auditoria do dia): o passo acima conferia o VERDE e nao o
      # NUMERO. Foi exatamente assim que a bancada ficou apagada em 23/08 —
      # `pytest tests/` colhia 6 de 70 testes e abortava, e o job passava verde
      # porque os 6 passaram. 17 arquivos nunca rodavam.
      #
      # O lado dos scripts legados ja tinha essa checagem; o lado do pytest, nao.
      # Piso, nao alvo: so acusa QUEDA. Teste novo sobe o numero e nao quebra
      # nada; teste que some, ou arquivo que para de ser colhido, derruba o CI.
      - name: a bancada nao pode ENCOLHER
        working-directory: backend
        env:
          # 🪤 27/08/2026 — O PISO ENVELHECEU ENQUANTO A BANCADA CRESCIA.
          # Ele nasceu em 23/08 pra pegar "pytest colheu 6 de 70 e passou
          # verde". Mas a bancada foi de 620 pra 837 em dois dias, e o piso
          # ficou em 700: perder DOIS arquivos inteiros ainda passaria.
          # Guarda com folga de 137 protege cada vez menos.
          # 📌 Ao acrescentar teste, subir isto junto — a margem é de ~30, o
          # bastante pra não quebrar num commit que remove um caso obsoleto.
          # 02/09/2026: 1044 -> 1367. A bancada foi a 1397 num dia (motor,
          # painel admin e smoke), e o piso velho já deixava passar a perda de
          # 25% dela. O guarda `test_o_piso_do_CI_faz_sentido_contra_a_realidade`
          # foi quem cobrou — piso que envelhece é piso que não guarda nada.
          # 04/09/2026: 1367 -> 1550. A bancada foi a 1824 em dois dias (varredura
          # adversarial + os achados que saíram da planilha da Caroline). Mesmo
          # guarda cobrando de novo, pelo mesmo motivo.
          PISO: 1550
        run: |
          N=$(python -m pytest tests/ -q --collect-only 2>/dev/null | tail -1 | grep -oE '^[0-9]+' || echo 0)
          echo "testes colhidos: $N (piso: $PISO)"
          if [ "$N" -lt "$PISO" ]; then
            echo "::error::A bancada colheu $N testes, abaixo do piso de $PISO."
            echo "Nao e o verde que importa: em 23/08 o pytest colhia 6 de 70 e"
            echo "passava. Se um arquivo parou de ser colhido, o conftest ou um"
            echo "erro de import estao engolindo ele."
            exit 1
          fi
