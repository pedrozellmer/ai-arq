name: Bancada (pytest)

# 🚨 23/08/2026 (auditoria): a bancada existia e estava APAGADA.
# `pytest backend/tests/` colhia 6 testes de UM arquivo e abortava com
# "I/O operation on closed file" — os outros 17 arquivos (consolidação de
# bitola, cotas do DXF, engine_rules, estrutural, trava de jobs concorrentes,
# revision_feedback) nunca rodavam juntos, e nada no CI os chamava.
# Agora roda a cada push, ANTES do smoke: erro de lógica morre aqui, sem
# esperar o deploy chegar na produção.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  bancada:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pyflakes esprima

      # A regra que nasceu do deploy 8d597a6 (NameError no boot, 21/08):
      # nome indefinido não aparece no py_compile, só no pyflakes.
      - name: pyflakes (nome indefinido derruba o boot)
        run: |
          python -m pyflakes backend/*.py | grep "undefined name" && exit 1 || true

      - name: pytest
        working-directory: backend
        run: python -m pytest tests/ -q
