# Deploy customizado pro GitHub Pages.
#
# Por que este workflow existe:
# - O deploy automático "pages build and deployment" do GitHub estava
#   falhando em 1s no step "Deploy to GitHub Pages" (environment
#   travado/state problem), sem nunca chegar a publicar.
# - Este workflow toma controle explícito do upload do artefato e do
#   deployment, usando as actions oficiais do GitHub. Mais confiável
#   que o pipeline automático.
#
# O que faz:
# 1. Checkout do repo
# 2. Empacota a raiz inteira como artefato estático
# 3. Faz deploy pro environment github-pages
#
# Quando dispara:
# - Todo push na main
# - Ou manualmente via "Run workflow" na aba Actions

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  # 🪤 03/08/2026: o blog publica por DATA (1 post/semana), mas o sitemap e os
  # links de "posts relacionados" são gerados uma vez e commitados — então o
  # post entrava no ar e continuava fora do sitemap, sem link interno nenhum,
  # até alguém lembrar de rodar o generate.py. O post de 02/08 estava exatamente
  # assim. Este cron diário faz o site se reconciliar sozinho com o calendário.
  schedule:
    - cron: "0 9 * * *"   # 06:00 em Brasília
  workflow_dispatch:

# Evita deploys concorrentes que causam race condition
concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Regenerate blog, sitemap and robots
        # posts.json é a fonte da verdade; tudo o que sai dele (HTMLs, index,
        # sitemap, links relacionados) é DERIVADO e depende da data de hoje.
        # Regerar aqui garante que o que vai pro ar corresponde ao calendário
        # de hoje, e não ao dia em que alguém rodou o script pela última vez.
        # generate.py usa só a biblioteca padrão PRA GERAR OS HTML. Os cards
        # de og:image usam PIL, que NÃO está neste runner — o gerador avisa e
        # segue, e os cards valem os COMMITADOS em blog/og/ (determinísticos:
        # mesmo título = mesmos bytes). A bancada tem guarda cobrando que todo
        # post commitado tenha seu card commitado.
        run: python blog/generate.py

      - name: Prepare static site directory
        # Copia apenas arquivos do frontend pro _site/, excluindo backend,
        # arquivos de trabalho/teste, .github, .git etc.
        run: |
          mkdir -p _site
          # Copia HTMLs, CSS, JS, imagens, fonts, favicon, CNAME, .nojekyll
          find . -maxdepth 1 -type f \( \
            -name "*.html" -o \
            -name "*.css" -o \
            -name "*.js" -o \
            -name "*.png" -o \
            -name "*.jpg" -o \
            -name "*.jpeg" -o \
            -name "*.gif" -o \
            -name "*.svg" -o \
            -name "*.ico" -o \
            -name "*.webp" -o \
            -name "*.woff*" -o \
            -name "*.ttf" -o \
            -name "CNAME" -o \
            -name ".nojekyll" \
          \) -exec cp {} _site/ \;
          # Copia SOMENTE as pastas que o site público usa.
          # NUNCA copiar: backend/ (código), frontend/ (app Next.js + node_modules),
          # docs/, _local/, email-templates/ — são internos e não podem ir pro ar.
          for d in assets blog exemplos indique instagram_assets; do
            if [ -d "$d" ]; then cp -r "$d" _site/; fi
          done
          # Limpa o blog: remove generate.py e posts.json (não devem ir pro deploy)
          if [ -d "_site/blog" ]; then
            rm -f _site/blog/generate.py _site/blog/posts.json
          fi
          # 🪤 28/07/2026: script interno estava sendo servido em
          # /blog/downloads/gen_memorial_template.py (HTTP 200 no site).
          # A limpeza acima só tirava generate.py; qualquer .py em pasta copiada
          # passava batido. Agora varre o _site inteiro — nenhum código-fonte
          # Python vai pro ar, hoje nem no futuro.
          find _site -type f -name "*.py" -print -delete
          # Copia sitemap.xml e robots.txt (na raiz)
          for f in sitemap.xml robots.txt; do
            if [ -f "$f" ]; then cp "$f" _site/; fi
          done
          # 🔒 30/08/2026 (auditoria): remove comentários HTML do site SERVIDO —
          # eram NOTAS DE DEV com métricas internas (funil, nº de clientes) lidas
          # por qualquer um com F12. O git mantém as notas; o público não as vê.
          # Só comentário HTML fora de <script>/<style> — não toca em JS.
          python scripts/strip_html_comments.py _site
          echo "=== Conteúdo de _site ==="
          ls -la _site/ | head -40
          echo "=== Total de arquivos: $(find _site -type f | wc -l) ==="

      - name: Gravar a versao do deploy
        # Arquivo minusculo que diz qual e a versao NO AR agora. O menu compara
        # com a versao carimbada no HTML que o navegador esta rodando; se
        # divergir, a pagina esta velha e ela se recarrega sozinha uma vez.
        # Sem isso, a unica saida era o cliente saber apertar Ctrl+Shift+R.
        run: echo "${GITHUB_SHA::8}" > _site/version.txt

      - name: Carimbar versao nos JS e CSS proprios
        # 🚨 O HTML e cacheado por 10 MINUTOS e os .js/.css por 4 HORAS
        # (Cache-Control: max-age=600 vs max-age=14400). Ou seja: depois de todo
        # deploy, por ate 4 horas o cliente roda HTML NOVO com JS VELHO.
        # Em 04/08 isso apareceu como "o menu nao tem Visao geral" logo depois
        # de subir a feature -- o HTML tinha as vistas novas e o menu-lateral.js
        # em cache era o da versao anterior. Nao e bug do codigo; e as duas
        # metades da pagina envelhecendo em ritmos diferentes.
        #
        # Carimbar o SHA do commit na URL do arquivo faz o navegador tratar
        # cada deploy como arquivo novo. O cache longo continua valendo (e bom:
        # economiza banda), mas deixa de servir a versao errada.
        # So mexe em caminho RELATIVO: CDN e link externo ficam intactos.
        run: |
          V="${GITHUB_SHA::8}"
          echo "carimbando versao $V"
          find _site -name "*.html" -type f -print0 | xargs -0 sed -i -E \
            's#(src|href)="([A-Za-z0-9_./-]+\.(js|css))"#\1="\2?v='"$V"'"#g'
          echo "=== conferindo: quantos ficaram carimbados ==="
          grep -oh 'src="[^"]*\.js?v=[^"]*"' _site/*.html 2>/dev/null | head -5 || true
          CARIMBADOS=$(grep -oh '\.\(js\|css\)?v=' _site/*.html 2>/dev/null | wc -l)
          echo "referencias carimbadas: $CARIMBADOS"
          if [ "$CARIMBADOS" -lt 5 ]; then
            echo "ERRO: quase nada foi carimbado — o padrao nao casou."
            echo "Sem isso o deploy sobe com o problema de versao mista. Abortando."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
