name: Smoke Test (produção)

# Roda 2 minutos após cada push pro main (dá tempo do Render deployar)
# + cron diário às 9h UTC (6h Brasília) pra pegar regressões silenciosas.
#
# Nível 1 (sempre): valida endpoints públicos sem credencial.
# Nível 2 (se SMOKE_USER_EMAIL+SMOKE_USER_PASSWORD setados nos Secrets):
#   loga via Supabase Auth, baixa planilha de um job real, valida 200.
# Nível 3 (Playwright, mesmas credenciais): browser real headless faz login,
#   abre projeto, clica em "Baixar XLSX" e confirma download. PEGA o bug que
#   o nível 2 NÃO pega: <a href> / window.open / window.location.href NÃO
#   enviam Authorization header → backend 401 mesmo com sessão válida.
#   Capítulo 2 do bug Daniela (2026-05-18) — esse nível teria pego em 1min.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    # 🚨 25/08: `contents: write` é o mínimo pra comentar no commit quando o
    # smoke falha — sem isso o GITHUB_TOKEN vem read-only e o motivo do
    # vermelho continua morrendo dentro do runner.
    # 🪤 Declarar `permissions` aqui SUBSTITUI o padrão do repositório: o que
    # não estiver nesta lista fica sem acesso. Este job só precisa disto.
    permissions:
      contents: write
    # 8min: o E2E agora espera até 60s pelo #login-email (o desafio invisível do
    # Cloudflare atrasa a página no browser automatizado) e ainda tem retry 1x.
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 🪤 21/08/2026: push só de frontend (precos.html) NÃO faz o Render
      # rebuildar — o poll esperava um commit que nunca ia chegar, o loop era
      # de 10 min e o timeout do job de 8: cancelado antes do "seguindo".
      # Agora: se o push não tocou no backend, não há deploy a esperar — o
      # smoke roda direto contra o que está no ar. E o loop cabe no timeout.
      - name: Mudou o backend neste push?
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$BEFORE" ] || echo "$BEFORE" | grep -q '^0*$'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch --quiet --depth=50 origin "$BEFORE" 2>/dev/null || true
          changed=$(git diff --name-only "$BEFORE" "$SHA" 2>/dev/null || echo "backend/?")
          echo "$changed" | sed 's/^/  /'
          if echo "$changed" | grep -qE '^(backend/|Dockerfile|requirements|render.yaml)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
            echo "Push sem backend — o Render não rebuilda; smoke roda contra o deploy atual."
          fi

      - name: Aguarda o deploy DESTE commit subir no Render (poll)
        if: steps.diff.outputs.backend != 'false'
        env:
          SHA: ${{ github.sha }}
        run: |
          # 🪤 28/07/2026: antes, o poll só checava se o backend RESPONDIA. Só que
          # o Render mantém a versão antiga no ar durante o build (deploy sem
          # downtime) — então respondia, com o CÓDIGO VELHO, e o smoke test
          # rodava contra a versão anterior. Toda mudança de backend virava
          # falha falsa (aconteceu no commit 2c6e5eb).
          # Agora esperamos o `commit` do endpoint raiz bater com o do push.
          SHORT="${SHA:0:7}"
          echo "Esperando o backend reportar commit $SHORT (build Docker leva 5-8min)."
          for i in $(seq 1 26); do   # 26×15s = 6,5 min, cabe no timeout de 8
            body=$(curl -sS --max-time 30 https://ai-arq.onrender.com/ 2>/dev/null || true)
            got=$(echo "$body" | sed -n 's/.*"commit"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
            if [ -n "$got" ] && [ "$got" = "$SHORT" ]; then
              echo "Deploy de $SHORT no ar após ~$((i*15))s."
              sleep 10   # margem pro worker assentar
              exit 0
            fi
            echo "tentativa $i/26: no ar=[${got:-nenhum}] esperado=[$SHORT] — aguardando 15s..."
            sleep 15
          done
          # Não falha o job: pode ser deploy só de frontend (o Render nem
          # rebuilda) ou a env RENDER_GIT_COMMIT não estar disponível.
          if echo "$body" | grep -q "AI.arq API"; then
            echo "::warning::Não confirmei o commit $SHORT em ~10min, mas o backend responde — seguindo."
          else
            echo "::warning::Backend não respondeu em ~10min — seguindo mesmo assim."
          fi

      - name: Rodar smoke test (níveis 1 + 2 — HTTP puro)
        env:
          SMOKE_USER_EMAIL: ${{ secrets.SMOKE_USER_EMAIL }}
          SMOKE_USER_PASSWORD: ${{ secrets.SMOKE_USER_PASSWORD }}
        # 🪤 `set -o pipefail`: sem isso o `tee` devolve 0 e o job fica VERDE
        # com o smoke reprovado — trocaria um alarme falso por um pior.
        run: |
          set -o pipefail
          python .github/scripts/smoke_test_production.py 2>&1 | tee -a smoke.log

      # Instala Playwright + Chromium pro nível 3 (browser real headless).
      # ~1 min de overhead — vale demais quando o cron diário descobre
      # regressão silenciosa só visível no navegador real (ex: bug Daniela).
      - name: Instalar Playwright
        run: |
          pip install playwright==1.48.0
          playwright install --with-deps chromium

      - name: Rodar smoke test E2E (nível 3 — browser real)
        env:
          SMOKE_USER_EMAIL: ${{ secrets.SMOKE_USER_EMAIL }}
          SMOKE_USER_PASSWORD: ${{ secrets.SMOKE_USER_PASSWORD }}
          SMOKE_SITE_BASE: https://ai.arq.br
        run: |
          set -o pipefail
          python .github/scripts/smoke_test_e2e.py 2>&1 | tee -a smoke.log

      # 🚨 25/08/2026: o motivo de um smoke vermelho MORRIA no runner. O log do
      # Actions exige admin (a API devolve 403 até em repo público) e as
      # anotações públicas só trazem "Smoke test falhou". Levei uma hora e o
      # tempo do Pedro pra descobrir que eram três 403 do Cloudflare — com o
      # site no ar e o nível 2 passando 9 de 9.
      # Comentário de commit é público e legível pela API sem credencial.
      - name: Publica o motivo da falha onde dê pra ler
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/smoke_report_failure.py

      - name: Notifica em caso de falha
        if: failure()
        run: |
          echo "::error::Smoke test falhou — verifique deploy do Render e endpoints protegidos"
          echo "Possíveis causas:"
          echo "  - Render free tier não acordou (dormiu mais de 15min)"
          echo "  - Endpoint protegido com regressão de RLS/JWT"
          echo "  - Migration de banco esperando aplicação"
          echo "  - Frontend usando navegação direta em endpoint protegido (nível 3)"
