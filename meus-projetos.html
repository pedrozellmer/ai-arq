<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=dashboard.html#meus-projetos">
  <title>Redirecionando — AI.arq</title>
  <meta name="robots" content="noindex,follow">
  <script>
    // Página legada — agora "Meus Projetos" é uma aba dentro do dashboard.
    // Redireciona pra dashboard.html e ativa a aba correspondente via hash.
    (function() {
      const target = 'dashboard.html';
      // Preserva query string (ex: ?job_id=X) caso alguém tenha bookmark antigo
      const qs = window.location.search || '';
      window.location.replace(target + qs + '#meus-projetos');
    })();
  </script>
</head>
