<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prancha — AI.arq</title>
  <meta name="robots" content="noindex,follow">
  <link rel="stylesheet" href="/tailwind.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="aiarq-utils.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', -apple-system, sans-serif; margin: 0; overflow: hidden; }
    .gradient-main { background: linear-gradient(135deg, #4f46e5 0%, #22D3EE 100%); }
    .viewer-container { height: 100vh; display: flex; flex-direction: column; }
    .viewer-toolbar {
      background: #1f2937; color: white; padding: 10px 16px;
      display: flex; align-items: center; gap: 12px;
      font-size: 13px; flex-shrink: 0;
      border-bottom: 2px solid transparent;
      border-image: linear-gradient(90deg, #4F46E5, #22D3EE) 1;
    }
    .viewer-frame { flex: 1; border: none; background: #4b5563; }
  </style>
</head>
<body>

<div class="viewer-container">
  <div class="viewer-toolbar">
    <div class="flex h-7 w-7 items-center justify-center rounded-lg gradient-main text-white font-bold text-xs" aria-hidden="true">AI</div>
    <button onclick="window.close()" class="text-gray-300 hover:text-indigo-300 flex items-center gap-1">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
      Fechar
    </button>
    <span class="text-gray-500">·</span>
    <span id="filename" class="font-medium truncate flex-1">Carregando...</span>
    <button onclick="downloadPdf()" title="Baixar o PDF original"
      class="text-gray-300 hover:text-indigo-300 flex items-center gap-1">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      Baixar
    </button>
  </div>
  <iframe id="pdf-frame" class="viewer-frame" title="Prancha PDF"></iframe>
</div>

<script>
// API_BASE + sbClient vêm de aiarq-utils.js
const API_BASE = window.API_BASE;
const sbClient = window.sbClient;

const urlParams = new URLSearchParams(window.location.search);
const jobId = urlParams.get('job_id');
const ref = urlParams.get('ref');

let currentBlobUrl = null;  // referência pra revogar no unload

// Exibe erro fatal SEM jogar dado do servidor em innerHTML (fix XSS 2026-07-22):
// o texto entra por textContent, imune a payload tipo <img src=x onerror=...>
// que antes vinha refletido no 'detail' do backend.
function showFatal(msg) {
  document.body.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.style.cssText = 'padding:40px;font-family:Inter;text-align:center;';
  const p1 = document.createElement('p');
  p1.textContent = msg;
  const p2 = document.createElement('p');
  p2.style.marginTop = '16px';
  const a = document.createElement('a');
  a.href = 'dashboard.html';
  a.style.cssText = 'color:#4f46e5;text-decoration:underline';
  a.textContent = 'Voltar pro dashboard';
  p2.appendChild(a);
  wrap.appendChild(p1); wrap.appendChild(p2);
  document.body.appendChild(wrap);
}

if (!jobId || !ref) {
  document.body.innerHTML = '<div style="padding:40px;font-family:Inter;text-align:center;">Parâmetros ausentes (?job_id=...&ref=...)</div>';
} else {
  const pdfUrl = `${API_BASE}/api/sheet/${jobId}?ref=${encodeURIComponent(ref)}`;
  document.getElementById('filename').textContent = decodeURIComponent(ref);

  // Ajustar título da aba com nome do arquivo
  document.title = decodeURIComponent(ref) + ' — AI.arq';

  // FIX bug Daniela 2026-06-02: iframe.src={endpoint protegido} NÃO envia
  // Authorization → 401. Solução: fetch com Bearer, gerar blob URL, atribuir
  // ao iframe. CLAUDE.md item 9.
  async function loadPdfIntoFrame() {
    try {
      const { data: { session } } = await sbClient.auth.getSession();
      if (!session) {
        document.body.innerHTML = '<div style="padding:40px;font-family:Inter;text-align:center;"><p>Sua sessão expirou. <a href="login.html" style="color:#4f46e5;text-decoration:underline">Entrar de novo</a> e voltar.</p></div>';
        return;
      }
      const resp = await fetch(pdfUrl, {
        headers: { 'Authorization': `Bearer ${session.access_token}` }
      });
      if (!resp.ok) {
        let detail = `HTTP ${resp.status}`;
        try { const j = await resp.json(); detail = j.detail || detail; } catch {}
        showFatal('Não consegui abrir a prancha: ' + detail);
        return;
      }
      const blob = await resp.blob();
      currentBlobUrl = URL.createObjectURL(blob);
      document.getElementById('pdf-frame').src = currentBlobUrl;
    } catch (e) {
      showFatal('Erro de rede ao carregar: ' + (e && e.message ? e.message : e));
    }
  }
  loadPdfIntoFrame();

  window.downloadPdf = async function() {
    // Se já temos blob carregado, usa direto. Senão refaz o fetch.
    if (currentBlobUrl) {
      const a = document.createElement('a');
      a.href = currentBlobUrl;
      a.download = decodeURIComponent(ref);
      document.body.appendChild(a);
      a.click();
      a.remove();
      return;
    }
    const { data: { session } } = await sbClient.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }
    const resp = await fetch(pdfUrl, {
      headers: { 'Authorization': `Bearer ${session.access_token}` }
    });
    if (!resp.ok) return;
    const blob = await resp.blob();
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = decodeURIComponent(ref);
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
  };

  window.addEventListener('beforeunload', () => {
    if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
  });
}
</script>

<script src="whatsapp-button.js" defer></script>
</body>
</html>
